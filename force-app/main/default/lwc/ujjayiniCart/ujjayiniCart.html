<template>

    <main class="cart-page">

        <div class="cart-atmosphere" aria-hidden="true">
            <div class="cart-light"></div>
        </div>


        <!-- =================================================
             GUEST REDIRECT / INITIAL LOADING
        ================================================== -->
        <template if:true={showLoader}>

            <section class="cart-state">

                <div class="loader-ring"></div>

                <p class="state-eyebrow">
                    {loaderText}
                </p>

            </section>

        </template>


        <!-- =================================================
             ERROR
        ================================================== -->
        <template if:true={showError}>

            <section class="cart-state">

                <p class="state-eyebrow">
                    YOUR COLLECTION
                </p>

                <h2 class="state-title">
                    Your cart could not be loaded.
                </h2>

                <p class="state-copy">
                    {errorMessage}
                </p>

                <button
                    class="ghost-button"
                    type="button"
                    onclick={handleRetry}
                >
                    TRY AGAIN
                </button>

            </section>

        </template>


        <!-- =================================================
             CART WITH ITEMS
        ================================================== -->
        <template if:true={hasItems}>

            <section class="cart-shell">

                <header class="cart-heading">

                    <p class="eyebrow">
                        YOUR CART
                    </p>

                    <h1 class="cart-title">
                        Your private <em>collection.</em>
                    </h1>

                    <p class="cart-count">
                        {itemCountLabel}
                    </p>

                </header>


                <div class="cart-layout">

                    <!-- ===== ITEMS ===== -->
                    <div class={itemsClass}>

                        <template
                            for:each={cartItems}
                            for:item="item"
                        >

                            <article
                                key={item.orderItemId}
                                class="cart-item"
                            >

                                <button
                                    class="item-visual"
                                    type="button"
                                    data-product-id={item.productId}
                                    onclick={handleViewProduct}
                                    aria-label={item.productName}
                                >

                                    <template if:true={item.productImageUrl}>

                                        <img
                                            class="item-image"
                                            src={item.productImageUrl}
                                            alt={item.productName}
                                        />

                                    </template>

                                    <template if:false={item.productImageUrl}>

                                        <span class="item-placeholder">
                                            U
                                        </span>

                                    </template>

                                </button>


                                <div class="item-info">

                                    <template if:true={item.collectionName}>

                                        <p class="item-collection">
                                            {item.collectionName}
                                        </p>

                                    </template>

                                    <h2 class="item-name">
                                        {item.productName}
                                    </h2>

                                    <template if:true={item.productCode}>

                                        <p class="item-code">
                                            {item.productCode}
                                        </p>

                                    </template>

                                    <p class="item-unit">
                                        {item.formattedUnitPrice}
                                    </p>

                                    <button
                                        class="remove-button"
                                        type="button"
                                        data-product-id={item.productId}
                                        onclick={handleRemove}
                                        disabled={isUpdating}
                                    >
                                        REMOVE
                                    </button>

                                </div>


                                <div class="item-quantity">

                                    <span class="quantity-label">
                                        QUANTITY
                                    </span>

                                    <div class="quantity-box">

                                        <button
                                            class="quantity-button"
                                            type="button"
                                            data-product-id={item.productId}
                                            onclick={handleDecrease}
                                            disabled={item.disableDecrease}
                                            aria-label="Decrease quantity"
                                        >
                                            −
                                        </button>

                                        <span class="quantity-value">
                                            {item.quantityNumber}
                                        </span>

                                        <button
                                            class="quantity-button"
                                            type="button"
                                            data-product-id={item.productId}
                                            onclick={handleIncrease}
                                            disabled={item.disableIncrease}
                                            aria-label="Increase quantity"
                                        >
                                            +
                                        </button>

                                    </div>

                                    <template lwc:if={item.hasStockHint}>
                                        <span class={item.stockHintClass}>
                                            {item.stockHint}
                                        </span>
                                    </template>

                                </div>


                                <div class="item-total">

                                    <span class="quantity-label">
                                        TOTAL
                                    </span>

                                    <span class="item-total-value">
                                        {item.formattedTotal}
                                    </span>

                                </div>

                            </article>

                        </template>

                    </div>


                    <!-- ===== SUMMARY ===== -->
                    <aside class="cart-summary">
   <c-ujjayini-checkout-address></c-ujjayini-checkout-address>
                        <p class="eyebrow">
                            ORDER SUMMARY
                        </p>

                        <div class="dotted"></div>

                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>{formattedTotal}</span>
                        </div>

                        <div class="summary-row summary-total">
                            <span>Total</span>
                            <span>{formattedTotal}</span>
                        </div>

                        <div class="dotted"></div>

                        <button
                            class="cta-primary"
                            type="button"
                            onclick={handleCheckout}
                            disabled={disableCheckout}
                        >
                            <span class="cta-inner">
                                {checkoutLabel}
                            </span>
                        </button>

                        <p class="summary-note">
                            You will complete your payment on
                            Razorpay's secure payment page.
                        </p>

                        <button
                            class="cta-secondary"
                            type="button"
                            onclick={goToWatches}
                        >
                            CONTINUE EXPLORING
                        </button>

                    </aside>

                </div>

            </section>

        </template>


        <!-- =================================================
             EMPTY CART
        ================================================== -->
        <template if:true={isEmpty}>

            <section class="cart-state empty-state">

                <p class="state-eyebrow">
                    YOUR CART
                </p>

                <h2 class="state-title">
                    Your collection <em>awaits.</em>
                </h2>

                <div class="gold-rule"></div>

                <p class="state-copy">
                    No timepiece has been chosen yet.
                    Discover the watches of UJJAYINI.
                </p>

                <button
                    class="ghost-button"
                    type="button"
                    onclick={goToWatches}
                >
                    EXPLORE THE TIMEPIECES
                </button>

            </section>

        </template>



        <!-- =================================================
             NOTIFICATION
        ================================================== -->
        <template if:true={showNotification}>

            <div
                class={notificationClass}
                role="status"
                aria-live="polite"
            >

                <div class="notification-content">

                    <p class="notification-kicker">
                        UJJAYINI · THE HOUSE OF TIME
                    </p>

                    <h3>
                        {notificationTitle}
                    </h3>

                    <p class="notification-message">
                        {notificationMessage}
                    </p>

                </div>

                <button
                    class="notification-close"
                    type="button"
                    onclick={closeNotification}
                    aria-label="Close notification"
                >
                    ×
                </button>

            </div>

        </template>

    </main>

</template>
