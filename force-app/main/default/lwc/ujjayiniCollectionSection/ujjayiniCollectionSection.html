<template>

    <main class="page">

        <!-- ================= HERO ================= -->
        <section class="hero">

            <div class="hero-photo" style={heroPhotoStyle} aria-hidden="true"></div>
            <div class="hero-tint" aria-hidden="true"></div>
            <div class="hero-glow" aria-hidden="true"></div>
            <div class="hero-grain" aria-hidden="true"></div>
            <span class="orbit orbit-a" aria-hidden="true"></span>
            <span class="orbit orbit-b" aria-hidden="true"></span>

            <div class="petals" aria-hidden="true">
                <template for:each={petals} for:item="petal">
                    <span key={petal.key} class={petal.className} style={petal.style}></span>
                </template>
            </div>

            <div class="hero-content">
                <p class="eyebrow"><span class="spark"></span>THE HOUSE OF UJJAYINI</p>
                <h1>Three expressions <em>of time.</em></h1>
                <p class="lede">
                    Every UJJAYINI timepiece begins with the same question:
                    not what time is, but what it means to remember it.
                </p>
                <div class="hero-actions">
                    <button class="btn-neon" type="button" onclick={scrollToShowcase}>
                        <span>MEET THE COLLECTIONS</span>
                        <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 V13 M4 9 L8 13 L12 9"></path></svg>
                    </button>
                    <button class="btn-glass" type="button" onclick={openQuiz}>FIND YOUR EXPRESSION</button>
                </div>
            </div>

            <div class="hero-meta">
                <span>UJJAYINI · HOROLOGY</span>
                <span class="meta-line"></span>
                <span>III EXPRESSIONS</span>
            </div>

        </section>


        <!-- ================= SHOWCASE ================= -->
        <section class="showcase">

            <header class="showcase-head">
                <p class="eyebrow center"><span class="spark"></span>THE COLLECTION</p>
                <h2>Choose your <em>expression.</em></h2>

                <template if:true={hasResult}>
                    <div class="result-chip">
                        <span class="result-dot"></span>
                        YOUR EXPRESSION · <b>{resultName}</b>
                        <button class="chip-link" type="button" onclick={openQuiz}>RETAKE</button>
                        <button class="chip-link" type="button" onclick={clearResult} aria-label="Forget my expression">✕</button>
                    </div>
                </template>
                <template if:false={hasResult}>
                    <button class="btn-glass small" type="button" onclick={openQuiz}>NOT SURE? TAKE THE 3-QUESTION QUIZ</button>
                </template>
            </header>

            <!-- Error (never technical) -->
            <template if:true={errorMessage}>
                <div class="state"><p>{errorMessage}</p></div>
            </template>

            <template if:true={showEmpty}>
                <div class="state"><p>UJJAYINI collections will appear here.</p></div>
            </template>

            <template if:true={hasCollections}>

                <div
                    class="stage"
                    tabindex="0"
                    role="region"
                    aria-label="Collections"
                    onkeydown={handleStageKey}
                    onpointerdown={handlePointerDown}
                    onpointerup={handlePointerUp}
                >

                    <template for:each={cards} for:item="card">

                        <article key={card.key} class={card.className} data-index={card.index} onclick={handleCardClick} aria-hidden={card.ariaHidden}>

                            <!-- The little spirit who keeps this collection -->
                            <template if:true={card.isCenter}>
                                <div class={card.spiritClass} aria-hidden="true">
                                    <span class="bubble"><b>{card.spiritName}</b>{card.spiritLine}</span>
                                    <svg viewBox="0 0 120 132">
                                        <g class="legs">
                                            <g class="leg leg-l">
                                                <path class="limb" d="M 50 96 L 47 120"></path>
                                                <ellipse class="foot" cx="45" cy="122" rx="7" ry="4.5"></ellipse>
                                            </g>
                                            <g class="leg leg-r">
                                                <path class="limb" d="M 70 96 L 73 120"></path>
                                                <ellipse class="foot" cx="75" cy="122" rx="7" ry="4.5"></ellipse>
                                            </g>
                                        </g>
                                        <g class="arm arm-wave"><path class="limb" d="M 30 70 Q 16 62 18 46"></path></g>
                                        <g class="arm"><path class="limb" d="M 90 74 Q 102 80 103 90"></path></g>
                                        <circle class="body" cx="60" cy="64" r="34"></circle>
                                        <ellipse class="belly" cx="60" cy="76" rx="18" ry="13"></ellipse>
                                        <g class="acc acc-moon"><path d="M 44 26 A 14 14 0 1 0 64 40 A 11 11 0 1 1 44 26 Z"></path></g>
                                        <g class="acc acc-sun">
                                            <path d="M 42 34 L 46 20 L 52 32 L 60 16 L 68 32 L 74 20 L 78 34 Z"></path>
                                        </g>
                                        <g class="acc acc-gear">
                                            <circle class="gear-teeth" cx="60" cy="28" r="11"></circle>
                                            <circle class="gear-hole" cx="60" cy="28" r="4"></circle>
                                        </g>
                                        <g class="eyes">
                                            <ellipse cx="49" cy="60" rx="3.8" ry="4.8"></ellipse>
                                            <ellipse cx="71" cy="60" rx="3.8" ry="4.8"></ellipse>
                                            <circle class="shine" cx="50.4" cy="58.4" r="1.3"></circle>
                                            <circle class="shine" cx="72.4" cy="58.4" r="1.3"></circle>
                                        </g>
                                        <circle class="cheek" cx="42" cy="70" r="4.4"></circle>
                                        <circle class="cheek" cx="78" cy="70" r="4.4"></circle>
                                        <path class="mouth" d="M 54 71 Q 60 77 66 71"></path>
                                        <!-- tiny watch in its hand -->
                                        <circle class="tiny-watch" cx="104" cy="94" r="7"></circle>
                                        <path class="tiny-hands" d="M 104 94 L 104 90 M 104 94 L 107 95"></path>
                                    </svg>
                                </div>
                            </template>

                            <div class={card.flipClass}>

                                <!-- FRONT -->
                                <div class="face front">
                                    <div class="visual">
                                        <template if:true={card.hasImage}>
                                            <span class="visual-image" style={card.imageStyle}></span>
                                        </template>
                                        <template if:false={card.hasImage}>
                                            <span class="visual-fallback">U</span>
                                        </template>
                                        <span class="visual-shade"></span>
                                        <span class="neon-edge"></span>
                                        <span class="card-number">{card.number}</span>
                                        <template if:true={card.matchLabel}>
                                            <span class="match">{card.matchLabel}</span>
                                        </template>
                                    </div>

                                    <div class="front-body">
                                        <p class="signature">{card.signature}</p>
                                        <h3>{card.name}</h3>
                                        <p class="tagline">{card.tagline}</p>
                                        <div class="actions">
                                            <button class="btn-neon small" type="button" data-key={card.key} onclick={exploreWatches}>
                                                <span>EXPLORE WATCHES</span>
                                                <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 L12 4 M6 4 H12 V10"></path></svg>
                                            </button>
                                            <button class="btn-text" type="button" data-key={card.key} onclick={toggleStory}>{card.storyLabel}</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- BACK: Philosophy & Craft -->
                                <div class="face back" onclick={stopPropagation}>
                                    <p class="signature">PHILOSOPHY &amp; CRAFT</p>
                                    <h3>{card.name}</h3>

                                    <div class="story">
                                        <div class="story-row">
                                            <span class="story-no">I</span>
                                            <div><p class="story-title">THE INSPIRATION</p><p class="story-copy">{card.inspiration}</p></div>
                                        </div>
                                        <div class="story-row">
                                            <span class="story-no">II</span>
                                            <div><p class="story-title">METAL &amp; GEMSTONE</p><p class="story-copy">{card.material}</p></div>
                                        </div>
                                        <div class="story-row">
                                            <span class="story-no">III</span>
                                            <div><p class="story-title">SIGNATURE DETAIL</p><p class="story-copy">{card.complication}</p></div>
                                        </div>
                                    </div>

                                    <template if:true={card.hasWatches}>
                                        <div class="strip">
                                            <p class="story-title">SIGNATURE PIECES</p>
                                            <div class="thumbs">
                                                <template for:each={card.watches} for:item="watch">
                                                    <button key={watch.productId} class="thumb" type="button" data-id={watch.productId} onclick={openWatch} title={watch.name} aria-label={watch.name}>
                                                        <span class="thumb-image" style={watch.style}></span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <div class="actions">
                                        <button class="btn-neon small" type="button" data-key={card.key} onclick={exploreWatches}>
                                            <span>EXPLORE WATCHES</span>
                                            <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 L12 4 M6 4 H12 V10"></path></svg>
                                        </button>
                                        <button class="btn-text" type="button" data-key={card.key} onclick={toggleStory}>{card.storyLabel}</button>
                                    </div>
                                </div>

                            </div>

                        </article>

                    </template>

                </div>

                <!-- Controls -->
                <nav class="controls" aria-label="Collection navigation">
                    <button class="nav-button" type="button" onclick={handlePrev}><span aria-hidden="true">←</span> PREVIOUS</button>
                    <div class="controls-center">
                        <span class="counter">{activeCounter}</span>
                        <div class="dots">
                            <template for:each={dots} for:item="dot">
                                <button key={dot.key} class={dot.className} type="button" data-index={dot.index} onclick={handleDot} aria-label={dot.label}></button>
                            </template>
                        </div>
                        <span class="active-name">{activeName}</span>
                    </div>
                    <button class="nav-button" type="button" onclick={handleNext}>NEXT <span aria-hidden="true">→</span></button>
                </nav>

            </template>

            <div class="closing">
                <span class="closing-rule"></span>
                <p>TIME IS NOT SIMPLY MEASURED. <em>IT IS REMEMBERED.</em></p>
                <span class="closing-rule"></span>
            </div>

        </section>


        <!-- ================= QUIZ ================= -->
        <template if:true={quizOpen}>
            <div class="quiz-backdrop" onclick={closeQuiz}>
                <section class="quiz" role="dialog" aria-label="Find your expression" onclick={stopPropagation}>

                    <header class="quiz-head">
                        <p class="eyebrow"><span class="spark"></span>FIND YOUR EXPRESSION</p>
                        <button class="close" type="button" onclick={closeQuiz} aria-label="Close">✕</button>
                    </header>

                    <div class="steps">
                        <template for:each={quizProgress} for:item="step">
                            <span key={step.key} class={step.className}></span>
                        </template>
                    </div>

                    <p class="quiz-no">{quizQuestion.number} / 03</p>
                    <h2 class="quiz-title">{quizQuestion.title}</h2>

                    <div class="options">
                        <template for:each={quizOptions} for:item="option">
                            <button key={option.key} class={option.className} type="button" data-value={option.value} onclick={chooseOption}>
                                <b>{option.label}</b>
                                <span>{option.hint}</span>
                            </button>
                        </template>
                    </div>

                    <template if:true={canGoBack}>
                        <button class="btn-text" type="button" onclick={quizBack}>← BACK</button>
                    </template>

                </section>
            </div>
        </template>

    </main>

</template>
