<template>

    <section class="collection-section">

        <!-- =====================================================
             ATMOSPHERIC BACKGROUND
        ====================================================== -->

        <div
            class="hero-photo"
            style={heroPhotoStyle}
        ></div>

        <div class="hero-vignette"></div>

        <div class="violet-atmosphere"></div>

        <div class="gold-orbit orbit-one"></div>
        <div class="gold-orbit orbit-two"></div>


        <!-- =====================================================
             HERO
        ====================================================== -->

        <header class="collection-hero">

            <div class="hero-meta">

                <span>
                    UJJAYINI · HOROLOGY
                </span>

                <span>
                    II · THE COLLECTION
                </span>

            </div>


            <div class="hero-content">

                <p class="eyebrow">
                    THE HOUSE OF UJJAYINI
                </p>


                <h1>
                    Three expressions
                    <br />
                    <em>of time.</em>
                </h1>


                <div class="hero-rule">
                    <span></span>
                </div>


                <p class="hero-description">

                    Every UJJAYINI timepiece begins with
                    the same question — not what time is,
                    but what it means to remember it.

                </p>


                <a
                    class="hero-cta"
                    href="#collections"
                >

                    <span>
                        EXPLORE THE COLLECTION
                    </span>

                    <span class="cta-arrow">
                        ↓
                    </span>

                </a>

            </div>


            <div class="hero-bottom-marker">

                <span>
                    SCROLL TO DISCOVER
                </span>

                <span class="marker-line"></span>

                <span>
                    UJJAYINI
                </span>

            </div>

        </header>


        <!-- =====================================================
             COLLECTIONS
        ====================================================== -->

        <div
            id="collections"
            class="collections-area"
        >

            <div class="section-heading">

                <p class="section-eyebrow">
                    THE COLLECTION
                </p>

                <h2>
                    Expressions of
                    <em>time.</em>
                </h2>

                <p class="section-copy">

                    Three distinct interpretations of
                    horology, united by one philosophy.

                </p>

            </div>


            <!-- =================================================
                 ERROR
            ================================================== -->

            <template if:true={errorMessage}>

                <div class="collection-state error-state">

                    <span>
                        COLLECTION UNAVAILABLE
                    </span>

                    <p>
                        {errorMessage}
                    </p>

                </div>

            </template>


            <!-- =================================================
                 EMPTY
            ================================================== -->

            <template if:true={showEmpty}>

                <div class="collection-state">

                    <span>
                        NO COLLECTIONS
                    </span>

                    <p>
                        UJJAYINI collections will appear here.
                    </p>

                </div>

            </template>


            <!-- =================================================
                 COLLECTION GRID
            ================================================== -->

            <template if:true={collections.length}>

                <div class="collection-grid">

                    <template
                        for:each={collections}
                        for:item="collection"
                    >

                        <article
                            key={collection.collectionId}
                            class="collection-card"
                            data-collection={collection.name}
                            onclick={handleCollectionClick}
                        >

                            <!-- =================================================
                                 IMAGE
                            ================================================== -->

                            <div class="collection-image">

                                <template
                                    if:true={collection.heroImageUrl}
                                >

                                    <img
                                        src={collection.heroImageUrl}
                                        alt={collection.name}
                                    />

                                </template>


                                <template
                                    if:false={collection.heroImageUrl}
                                >

                                    <div class="image-placeholder">
                                        UJJAYINI
                                    </div>

                                </template>


                                <div class="image-overlay"></div>


                                <div class="image-number">
                                    {collection.displayIndex}
                                </div>


                                <div class="image-category">
                                    UJJAYINI COLLECTION
                                </div>

                            </div>


                            <!-- =================================================
                                 CONTENT
                            ================================================== -->

                            <div class="collection-content">

                                <div class="collection-topline">

                                    <span>
                                        {collection.displayIndex}
                                    </span>

                                    <span>
                                        THE HOUSE
                                    </span>

                                </div>


                                <h3>
                                    {collection.name}
                                </h3>


                                <div class="gold-line"></div>


                                <template
                                    if:true={collection.shortDescription}
                                >

                                    <p class="short-description">
                                        {collection.shortDescription}
                                    </p>

                                </template>


                                <template
                                    if:false={collection.shortDescription}
                                >

                                    <p class="short-description">
                                        A distinctive expression of
                                        UJJAYINI horology.
                                    </p>

                                </template>


                                <div class="collection-bottom">

                                    <span class="discover">
                                        EXPLORE WATCHES
                                    </span>

                                    <span class="arrow">
                                        ↗
                                    </span>

                                </div>

                            </div>

                        </article>

                    </template>

                </div>

            </template>


            <!-- =================================================
                 CLOSING STATEMENT
            ================================================== -->

            <div class="collection-closing">

                <div class="closing-rule"></div>

                <p>

                    TIME IS NOT SIMPLY MEASURED.

                    <em>
                        IT IS REMEMBERED.
                    </em>

                </p>

                <div class="closing-rule"></div>

            </div>

        </div>


        <!-- =====================================================
             SECTION MARKER
        ====================================================== -->

        <div class="section-marker">

            <span>
                II
            </span>

            <span class="marker-line"></span>

            <span>
                THE COLLECTION
            </span>

        </div>

    </section>

</template>
