<template>

    <section class="vault">

        <!-- ================= THE EVENT HORIZON ================= -->
        <canvas class="horizon" aria-hidden="true"></canvas>
        <div class="veil" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>


        <!-- ================= HERO ================= -->
        <header class="hero">

            <div class="hero-copy">

                <p class="eyebrow"><span class="dot"></span>THE COLLECTOR'S VAULT</p>

                <h1>
                    Your time,
                    <em>kept forever.</em>
                </h1>

                <p class="intro">
                    A private orbit for the timepieces that have become yours:
                    their ownership, their protection and their certificates, held in one place.
                </p>

                <template if:true={hasAssets}>
                    <div class="stats">
                        <div class="stat">
                            <strong>{countLabel}</strong>
                            <span>{countWord}</span>
                        </div>
                        <div class="stat">
                            <strong>{protectedCount}</strong>
                            <span>UNDER WARRANTY</span>
                        </div>
                        <div class="stat">
                            <strong>{certifiedCount}</strong>
                            <span>CERTIFIED</span>
                        </div>
                    </div>
                </template>

                <div class="hero-actions">
                    <button class="btn-primary" type="button" onclick={scrollToCollection}>
                        <span>OPEN THE VAULT</span>
                        <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 V13 M4 9 L8 13 L12 9"></path></svg>
                    </button>
                    <button class="btn-ghost" type="button" onclick={goToWatches}>ADD A TIMEPIECE</button>
                </div>

                <!-- Payment confirmation -->
                <template if:true={showPaymentBanner}>
                    <div class={paymentBannerClass} role="status" aria-live="polite">

                        <div class="payment-mark">
                            <template if:true={isVerifyingPayment}>
                                <span class="payment-spinner"></span>
                            </template>
                            <template if:false={isVerifyingPayment}>
                                <span class="payment-check">✓</span>
                            </template>
                        </div>

                        <div class="payment-copy">
                            <p class="micro">{paymentBannerEyebrow}</p>
                            <h3>{paymentBannerTitle}</h3>
                            <p class="payment-message">{paymentBannerMessage}</p>
                        </div>

                        <template if:true={showRefresh}>
                            <button class="btn-ghost small" type="button" onclick={handleRefreshVault}>REFRESH</button>
                        </template>

                        <template if:true={isPaymentDone}>
                            <button class="icon-button" type="button" onclick={handleDismissPayment} aria-label="Dismiss">✕</button>
                        </template>

                    </div>
                </template>

            </div>

            <span class="scroll-cue" aria-hidden="true"><i></i>SCROLL INTO THE VAULT</span>

        </header>


        <!-- ================= COLLECTION ================= -->
        <section class="collection">

            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="state">
                    <div class="loader"></div>
                    <p class="micro">OPENING YOUR COLLECTION</p>
                </div>
            </template>

            <!-- Error (never technical) -->
            <template if:true={errorMessage}>
                <div class="state panel">
                    <p class="micro">COLLECTION RESTING</p>
                    <h2>The vault will open <em>in a moment.</em></h2>
                    <p class="copy">{errorMessage}</p>
                    <button class="btn-ghost" type="button" onclick={handleRefreshVault}>REFRESH</button>
                </div>
            </template>

            <!-- Drawers -->
            <template if:true={hasAssets}>

                <div class="collection-head">
                    <div>
                        <p class="micro">YOUR TIMEPIECES</p>
                        <h2>The <em>Collection</em></h2>
                    </div>
                    <div class="count">
                        <strong>{countLabel}</strong>
                        <span>{countWord}</span>
                    </div>
                </div>

                <div class="drawers">

                    <template for:each={cards} for:item="card">

                        <article key={card.assetId} class={card.className}>

                            <button class="drawer-visual" type="button" data-id={card.assetId} onclick={openDetails} aria-label="Open details">
                                <template if:true={card.hasImage}>
                                    <span class="drawer-image" style={card.imageStyle}></span>
                                </template>
                                <template if:false={card.hasImage}>
                                    <span class="drawer-fallback">U</span>
                                </template>
                                <span class="drawer-index">{card.index}</span>
                                <span class="drawer-shine" aria-hidden="true"></span>
                            </button>

                            <div class="drawer-body">

                                <div class="drawer-top">
                                    <span class="collection-tag">{card.collectionLabel}</span>
                                    <span class="status-chip">{card.statusLabel}</span>
                                </div>

                                <h3 class="drawer-name">
                                    {card.productName}
                                    <template if:true={card.hasQuantity}>
                                        <span class="qty">{card.quantityLabel}</span>
                                    </template>
                                </h3>

                                <dl class="meta">
                                    <div><dt>ACQUIRED</dt><dd>{card.acquired}</dd></div>
                                    <div><dt>VALUE</dt><dd>{card.value}</dd></div>
                                    <div><dt>CERTIFICATE</dt><dd class="cert-no">{card.certificateNumber}</dd></div>
                                </dl>

                                <div class={card.warrantyClass}>
                                    <div class="warranty-line">
                                        <span>{card.warrantyLabel}</span>
                                        <span>{card.coverage}</span>
                                    </div>
                                    <div class="bar"><span class="bar-fill" style={card.barStyle}></span></div>
                                </div>

                                <div class="drawer-actions">
                                    <button class="btn-primary small" type="button" data-id={card.assetId} onclick={downloadCertificate} disabled={card.isDownloading}>
                                        <span>{card.certLabel}</span>
                                        <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 V13 M4 9 L8 13 L12 9"></path></svg>
                                    </button>
                                    <button class="btn-ghost small" type="button" data-id={card.assetId} onclick={openDetails}>DETAILS</button>
                                    <button class="link" type="button" onclick={goToService}>REQUEST SERVICE</button>
                                </div>

                            </div>

                        </article>

                    </template>

                </div>

            </template>

            <!-- Empty -->
            <template if:true={isEmpty}>
                <div class="state empty">
                    <div class="empty-hole" aria-hidden="true"><span></span></div>
                    <p class="micro">THE COLLECTOR'S VAULT</p>
                    <h2>Your collection <em>begins here.</em></h2>
                    <p class="copy">Your UJJAYINI timepieces will appear here after a successful payment, with their warranty and certificate.</p>
                    <button class="btn-primary" type="button" onclick={goToWatches}><span>EXPLORE THE TIMEPIECES</span></button>
                </div>
            </template>

            <footer class="vault-footer">
                <span>VI — THE COLLECTOR'S VAULT</span>
                <span>TIME, KEPT WITHIN.</span>
            </footer>

        </section>


        <!-- ================= DETAIL PANEL ================= -->
        <template if:true={showPanel}>
            <div class="panel-backdrop" onclick={closeDetails}>

                <aside class="detail" role="dialog" aria-label="Timepiece details" onclick={stopPropagation}>

                    <button class="icon-button detail-close" type="button" onclick={closeDetails} aria-label="Close">✕</button>

                    <div class="detail-visual">
                        <template if:true={openCard.hasImage}>
                            <span class="detail-image" style={openCard.imageLargeStyle}></span>
                        </template>
                        <span class="detail-ring" aria-hidden="true"></span>
                    </div>

                    <div class="detail-body">

                        <p class="micro">{openCard.collectionLabel} · {openCard.statusLabel}</p>
                        <h2>{openCard.productName}</h2>

                        <dl class="detail-specs">
                            <div><dt>ACQUIRED</dt><dd>{openCard.acquired}</dd></div>
                            <div><dt>VALUE</dt><dd>{openCard.value}</dd></div>
                            <template for:each={openCard.specs} for:item="spec">
                                <div key={spec.key}><dt>{spec.label}</dt><dd>{spec.value}</dd></div>
                            </template>
                        </dl>

                        <!-- Warranty timeline -->
                        <div class="timeline-block">
                            <p class="micro">PROTECTED TIME</p>
                            <template if:true={openCard.hasWarranty}>
                                <div class="timeline">
                                    <span class="timeline-track"></span>
                                    <span class="timeline-now" style={openCard.timelineStyle}><i></i><b>TODAY</b></span>
                                </div>
                                <div class="timeline-ends">
                                    <span><b>{openCard.warrantyStart}</b>STARTED</span>
                                    <span class="right"><b>{openCard.warrantyEnd}</b>ENDS</span>
                                </div>
                                <p class="timeline-label">{openCard.warrantyLabel} · {openCard.coverage} · {openCard.duration}</p>
                                <template if:true={openCard.warrantyNotes}>
                                    <p class="note">{openCard.warrantyNotes}</p>
                                </template>
                            </template>
                            <template if:false={openCard.hasWarranty}>
                                <p class="copy">Warranty details are being prepared for this timepiece.</p>
                            </template>
                        </div>

                        <!-- Certificate preview -->
                        <div class="certificate">
                            <div class="certificate-paper">
                                <span class="cert-mono">U</span>
                                <span class="cert-brand">UJJAYINI</span>
                                <span class="cert-title">Certificate of Authenticity</span>
                                <span class="cert-sub">and Ownership</span>
                                <span class="cert-piece">{openCard.productName}</span>
                                <span class="cert-number">{openCard.certificateNumber}</span>
                            </div>
                            <div class="certificate-copy">
                                <p class="micro">YOUR CERTIFICATE</p>
                                <p class="copy">A numbered record that this timepiece is an authentic UJJAYINI creation, held in your collection.</p>
                                <button class="btn-primary" type="button" data-id={openCard.assetId} onclick={downloadCertificate} disabled={openCard.isDownloading}>
                                    <span>DOWNLOAD PDF</span>
                                    <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 V13 M4 9 L8 13 L12 9"></path></svg>
                                </button>
                            </div>
                        </div>

                        <button class="btn-ghost wide" type="button" onclick={goToService}>REQUEST A SERVICE FOR THIS TIMEPIECE</button>

                    </div>

                </aside>

            </div>
        </template>


        <!-- ================= TOAST ================= -->
        <template if:true={toastTitle}>
            <div class={toastClass} role="status" aria-live="polite">
                <div>
                    <span class="micro">UJJAYINI · THE HOUSE OF TIME</span>
                    <strong>{toastTitle}</strong>
                    <p>{toastMessage}</p>
                </div>
                <button class="icon-button" type="button" onclick={closeToast} aria-label="Close">✕</button>
            </div>
        </template>

    </section>

</template>
