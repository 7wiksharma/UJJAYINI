<template>

   <section
    class="vault"
    style={vaultBackgroundStyle}
    >

        <!-- =========================================================
             ATMOSPHERE
        ========================================================== -->

        <div class="vault-atmosphere"></div>

        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="orbit orbit-three"></div>

        <div class="star star-one"></div>
        <div class="star star-two"></div>
        <div class="star star-three"></div>
        <div class="star star-four"></div>
        <div class="star star-five"></div>


        <!-- =========================================================
             MAIN CONTENT
        ========================================================== -->

        <div class="vault-inner">


            <!-- =====================================================
                 TOP MARKERS
            ====================================================== -->

            <div class="section-markers">

                <span>
                    
                </span>

                <span>
                 
                </span>

            </div>


            <!-- =====================================================
                 HEADER
            ====================================================== -->

            <header class="vault-header">

                <p class="eyebrow">
                    THE PRIVATE COLLECTION
                </p>


                <h1>
                    Your time,<br>
                    <em>kept forever.</em>
                </h1>


                <div class="gold-rule"></div>


                <p class="intro">
                    A private record of the timepieces that
                    have become part of your collection.
                </p>

            </header>


            <!-- =====================================================
                 PAYMENT CONFIRMATION
            ====================================================== -->

            <template if:true={showPaymentBanner}>

                <div
                    class={paymentBannerClass}
                    role="status"
                    aria-live="polite"
                >

                    <div class="payment-mark">

                        <template if:true={isVerifyingPayment}>
                            <span class="payment-spinner"></span>
                        </template>

                        <template if:false={isVerifyingPayment}>
                            <span class="payment-check">✓</span>
                        </template>

                    </div>


                    <div class="payment-copy">

                        <p class="micro-label">
                            {paymentBannerEyebrow}
                        </p>

                        <h3>
                            {paymentBannerTitle}
                        </h3>

                        <p class="payment-message">
                            {paymentBannerMessage}
                        </p>

                    </div>


                    <template if:true={showRefresh}>

                        <button
                            class="payment-action"
                            type="button"
                            onclick={handleRefreshVault}
                        >
                            REFRESH
                        </button>

                    </template>


                    <template if:false={isVerifyingPayment}>

                        <button
                            class="payment-close"
                            type="button"
                            onclick={handleDismissPayment}
                            aria-label="Dismiss"
                        >
                            ×
                        </button>

                    </template>

                </div>

            </template>


            <!-- =====================================================
                 LOADING
            ====================================================== -->

            <template if:true={isLoading}>

                <div class="state loading-state">

                    <div class="loading-mark">
                        U
                    </div>

                    <p>
                        Opening your collection...
                    </p>

                </div>

            </template>


            <!-- =====================================================
                 ERROR
            ====================================================== -->

            <template if:true={errorMessage}>

                <div class="state error-state">

                    <div class="state-label">
                        COLLECTION UNAVAILABLE
                    </div>

                    <p>
                        {errorMessage}
                    </p>

                </div>

            </template>


            <!-- =====================================================
                 COLLECTION
            ====================================================== -->

            <template if:true={hasAssets}>

                <div class="collection-intro">

                    <div>

                        <p class="micro-label">
                            YOUR TIMEPIECES
                        </p>

                        <h2>
                            The Collection
                        </h2>

                    </div>


                    <div class="collection-count">

                        <span>
                            {assets.length}
                        </span>

                        <small>
                            TIMEPIECE<span if:true={hasMultipleAssets}>S</span>
                        </small>

                    </div>

                </div>


                <!-- =================================================
                     WATCH GRID
                ================================================== -->

                <div class="collection-grid">

                    <template
                        for:each={assets}
                        for:item="asset"
                    >

                        <article
                            key={asset.assetId}
                            class="watch-card"
                        >


                            <!-- =====================================
                                 WATCH VISUAL
                            ====================================== -->

                            <div class="watch-visual">

                                <div class="watch-orbit"></div>

                                <div class="watch-glow"></div>


                                <!-- =================================
                                     PRODUCT IMAGE
                                ================================== -->

                                <template if:true={asset.productImageUrl}>

                                    <img
                                        class="product-image"
                                        src={asset.productImageUrl}
                                        alt={asset.productName}
                                    />

                                </template>


                                <!-- =================================
                                     FALLBACK UJJAYINI SYMBOL
                                ================================== -->

                                <template if:false={asset.productImageUrl}>

                                    <div class="watch-symbol">

                                        <span class="watch-symbol-top">
                                            XII
                                        </span>

                                        <span class="watch-symbol-center">
                                            U
                                        </span>

                                        <span class="watch-symbol-bottom">
                                            VI
                                        </span>

                                    </div>

                                </template>


                                <span class="visual-caption">
                                    UJJAYINI
                                </span>

                            </div>


                            <!-- =====================================
                                 WATCH INFORMATION
                            ====================================== -->

                            <div class="watch-content">


                                <div class="watch-topline">

                                    <p class="watch-label">
                                        COLLECTOR ASSET
                                    </p>

                                    <span class="asset-status">
                                        {asset.status}
                                    </span>

                                </div>


                                <h3>
                                    {asset.productName}
                                </h3>


                                <div class="watch-rule"></div>


                                <!-- =================================
                                     PRIMARY DETAILS
                                ================================== -->

                                <div class="details-grid">


                                    <div class="detail">

                                        <span>
                                            PURCHASE DATE
                                        </span>

                                        <strong>
                                            {asset.purchaseDate}
                                        </strong>

                                    </div>


                                    <div class="detail">

                                        <span>
                                            QUANTITY
                                        </span>

                                        <strong>
                                            {asset.quantity}
                                        </strong>

                                    </div>


                                    <div class="detail">

                                        <span>
                                            VALUE
                                        </span>

                                        <strong>
                                            ₹{asset.price}
                                        </strong>

                                    </div>


                                    <div class="detail">

                                        <span>
                                            ASSET REFERENCE
                                        </span>

                                        <strong class="reference">
                                            {asset.serialNumber}
                                        </strong>

                                    </div>

                                </div>


                                <!-- =================================
                                     WARRANTY
                                ================================== -->

                                <template if:true={asset.warranty}>

                                    <div class="warranty">

                                        <div class="warranty-heading">

                                            <div>

                                                <p class="watch-label">
                                                    WARRANTY
                                                </p>

                                                <h4>
                                                    Protected time
                                                </h4>

                                            </div>


                                            <span class="warranty-status">
                                                {asset.warranty.status}
                                            </span>

                                        </div>


                                        <div class="warranty-grid">


                                            <div>

                                                <span>
                                                    COVERAGE
                                                </span>

                                                <strong>
                                                    {asset.warranty.coverageType}
                                                </strong>

                                            </div>


                                            <div>

                                                <span>
                                                    DURATION
                                                </span>

                                                <strong>
                                                    {asset.warranty.durationMonths}
                                                    months
                                                </strong>

                                            </div>


                                            <div>

                                                <span>
                                                    START
                                                </span>

                                                <strong>
                                                    {asset.warranty.startDate}
                                                </strong>

                                            </div>


                                            <div>

                                                <span>
                                                    END
                                                </span>

                                                <strong>
                                                    {asset.warranty.endDate}
                                                </strong>

                                            </div>

                                        </div>


                                        <template
                                            if:true={asset.warranty.notes}
                                        >

                                            <div class="warranty-note">

                                                <span>
                                                    NOTE
                                                </span>

                                                <p>
                                                    {asset.warranty.notes}
                                                </p>

                                            </div>

                                        </template>

                                    </div>

                                </template>


                                <!-- =================================
                                     NO WARRANTY
                                ================================== -->

                                <template if:false={asset.warranty}>

                                    <div class="warranty-unavailable">
                                        Warranty information unavailable.
                                    </div>

                                </template>

                            </div>

                        </article>

                    </template>

                </div>

            </template>


            <!-- =====================================================
                 EMPTY VAULT
            ====================================================== -->

            <template if:true={isEmpty}>

                <div class="empty-vault">

                    <div class="empty-orbit">

                        <div class="empty-mark">
                            U
                        </div>

                    </div>


                    <p class="micro-label">
                        THE COLLECTOR'S VAULT
                    </p>


                    <h2>
                        Your collection<br>
                        <em>begins here.</em>
                    </h2>


                    <div class="gold-rule"></div>


                    <p class="empty-copy">
                        Your purchased UJJAYINI timepieces will
                        appear here after a successful payment.
                    </p>

                </div>

            </template>


            <!-- =====================================================
                 FOOTER NOTE
            ====================================================== -->

            <footer class="vault-footer">

                <div class="footer-marker">
                    VI — THE COLLECTOR'S VAULT
                </div>

                <div class="footer-note">
                    TIME, KEPT WITHIN.
                </div>

            </footer>

        </div>

    </section>

</template>
