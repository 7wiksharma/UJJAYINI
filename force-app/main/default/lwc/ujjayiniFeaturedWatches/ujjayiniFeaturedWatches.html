<template>
    <section class="featured-section" aria-labelledby="featured-title">
        <header class="section-heading">
            <div>
                <p class="eyebrow">FEATURED TIMEPIECES</p>
                <h2 id="featured-title">Timepieces <em>of Ujjayini</em></h2>
            </div>
            <p class="intro-copy">Precision shaped by the sky, crafted for the moments that become yours.</p>
        </header>

        <template lwc:if={watches.length}>
            <div class="watch-grid">
                <template for:each={watches} for:item="watch">
                    <article class="watch-card" key={watch.productId}>
                        <div class="watch-visual">
                            <template lwc:if={watch.imageUrl}>
                                <img src={watch.imageUrl} alt={watch.name} loading="lazy" />
                            </template>
                            <template lwc:else>
                                <span class="image-mark" aria-hidden="true">U</span>
                            </template>
                            <span class="watch-index" aria-hidden="true">{watch.displayIndex}</span>
                        </div>
                        <div class="watch-details">
                            <template lwc:if={watch.collection}>
                                <p class="watch-collection">{watch.collection}</p>
                            </template>
                            <h3>{watch.name}</h3>
                            <p class="watch-meta">{watch.metadata}</p>
                            <button class="watch-link" data-id={watch.productId} onclick={handleExplore}>
                                VIEW WATCH <span aria-hidden="true">→</span>
                            </button>
                        </div>
                    </article>
                </template>
            </div>
        </template>

        <template lwc:elseif={errorMessage}>
            <p class="state-message">Featured timepieces are temporarily unavailable.</p>
        </template>
        <template lwc:elseif={showEmpty}>
            <p class="state-message">The collection is being prepared.</p>
        </template>
    </section>
</template>
