    <section class="hero">

        <!-- =====================================================
             CINEMATIC VIDEO
        ====================================================== -->

        <div class="video-frame">

            <video
                class="hero-video"
                autoplay
                muted
                loop
                playsinline
                preload="auto">

                <source
                    src={videoUrl}
                    type="video/mp4" />

            </video>

        </div>


        <!-- =====================================================
             ATMOSPHERE
        ====================================================== -->

        <div class="video-overlay"></div>

        <div class="left-depth"></div>

        <div class="bottom-fade"></div>


        <!-- =====================================================
             ATMOSPHERIC GLOW
        ====================================================== -->

        <div class="atmosphere atmosphere-one"></div>

        <div class="atmosphere atmosphere-two"></div>


        <!-- =====================================================
             ORBITAL SYSTEM
        ====================================================== -->

        <div class="orbit orbit-one"></div>

        <div class="orbit orbit-two"></div>

        <div class="orbit orbit-three"></div>


        <!-- =====================================================
             BRAND CONTENT
        ====================================================== -->

        <div class="hero-content">

            <div class="eyebrow-row">

                <span class="eyebrow-line"></span>

                <p class="eyebrow">
                    MAISON OF VEDIC HOROLOGY
                </p>

            </div>


            <h1 class="brand-title">
                UJJAYINI
            </h1>


            <p class="tagline">
                The beginning of your time.
            </p>


            <p class="hero-description">
                A modern expression of Indian horology,
                shaped by the place where time was first
                observed through the heavens.
            </p>


            <!-- =================================================
                 ONLY CTA
            ================================================== -->

            <button
                class="explore-button"
                type="button"
                onclick={handleExplore}>

                <span class="button-text">

                </span>

                <span class="button-arrow">
                    ↓
                </span>

            </button>

        </div>


        <!-- =====================================================
             GHAṬIKĀ
        ====================================================== -->

        <div class="ghatika">

            <span class="ghatika-label">
                CURRENT GHAṬIKĀ
            </span>

            <span class="ghatika-number">
                {ghatika}
            </span>

            <span class="ghatika-total">
                / 60
            </span>

        </div>


        <!-- =====================================================
             VIDEO LABEL
        ====================================================== -->

        <div class="video-label">

            <span>
                UJJAYINI
            </span>

            <span>
                TIME · OBSERVED
            </span>

        </div>
