<template>

    <main class="login-page">

        <div class="dust" aria-hidden="true"></div>
        <div class="glow" aria-hidden="true"></div>

        <div class="login-grid">

            <!-- =====================================================
                 FORM
            ====================================================== -->

            <section class="form-panel">

                <p class="eyebrow">THE HOUSE OF UJJAYINI</p>

                <template if:true={isLoginMode}>

                    <h1 class="title">
                        Welcome <em>back.</em>
                    </h1>

                    <p class="lede">
                        Sign in to your collection, your orders and your vault.
                    </p>

                    <div class="form" onkeydown={handleKeydown}>

                        <label class="field">
                            <span class="field-label">EMAIL OR USERNAME</span>
                            <input
                                class="field-control"
                                type="text"
                                data-field="identifier"
                                value={identifier}
                                oninput={handleInput}
                                autocomplete="username"
                            />
                        </label>

                        <label class="field">
                            <span class="field-label">PASSWORD</span>
                            <span class="password-wrap">
                                <input
                                    class="field-control"
                                    type={passwordType}
                                    data-field="password"
                                    value={password}
                                    oninput={handleInput}
                                    autocomplete="current-password"
                                />
                                <button type="button" class="toggle" onclick={togglePassword}>
                                    {toggleLabel}
                                </button>
                            </span>
                        </label>

                        <button type="button" class="text-link forgot" onclick={showReset}>
                            Forgot your password?
                        </button>

                        <template if:true={errorMessage}>
                            <p class="form-error" role="alert">{errorMessage}</p>
                        </template>

                        <button
                            type="button"
                            class="primary"
                            onclick={handleLogin}
                            disabled={isSubmitting}
                        >
                            <span class="primary-inner">
                                <span>{signInLabel}</span>
                                <span class="arrow">→</span>
                            </span>
                        </button>

                    </div>

                    <div class="divider"><span>NEW TO UJJAYINI</span></div>

                    <a href={signupUrl} class="secondary">
                        BECOME A MEMBER
                    </a>

                </template>


                <template if:false={isLoginMode}>

                    <h1 class="title">
                        Reset your <em>password.</em>
                    </h1>

                    <template if:false={resetSent}>

                        <p class="lede">
                            Enter the email of your UJJAYINI account and we
                            will send you a link to set a new password.
                        </p>

                        <div class="form" onkeydown={handleKeydown}>

                            <label class="field">
                                <span class="field-label">EMAIL OR USERNAME</span>
                                <input
                                    class="field-control"
                                    type="text"
                                    data-field="identifier"
                                    value={identifier}
                                    oninput={handleInput}
                                    autocomplete="username"
                                />
                            </label>

                            <template if:true={errorMessage}>
                                <p class="form-error" role="alert">{errorMessage}</p>
                            </template>

                            <button
                                type="button"
                                class="primary"
                                onclick={handleReset}
                                disabled={isSubmitting}
                            >
                                <span class="primary-inner">
                                    <span>{resetLabel}</span>
                                    <span class="arrow">→</span>
                                </span>
                            </button>

                        </div>

                    </template>

                    <template if:true={resetSent}>
                        <p class="notice">
                            If an account exists for this email, a reset link
                            is on its way. Please also check your spam folder.
                        </p>
                    </template>

                    <button type="button" class="text-link back" onclick={showLogin}>
                        ← Back to sign in
                    </button>

                </template>

                <a href={homeUrl} class="text-link continue">
                    Continue exploring as a guest
                </a>

            </section>


            <!-- =====================================================
                 EXPLODED WATCH
            ====================================================== -->

            <section class="stage" aria-hidden="true">

                <div class="shards">
                    <span class="shard s1"></span>
                    <span class="shard s2"></span>
                    <span class="shard s3"></span>
                    <span class="shard s4"></span>
                    <span class="shard s5"></span>
                    <span class="shard s6"></span>
                    <span class="shard s7"></span>
                    <span class="shard s8"></span>
                </div>

                <div class="watch-sway">

                    <div class="part strap-top"></div>
                    <div class="part strap-bottom"></div>
                    <div class="part case"></div>
                    <div class="part bezel"></div>

                    <div class="part dial">
                        <span class="subdial sd1"></span>
                        <span class="subdial sd2"></span>
                        <span class="subdial sd3"></span>
                        <span class="dial-mark">U</span>
                    </div>

                    <div class="part hands">
                        <span class="hand hour"></span>
                        <span class="hand minute"></span>
                        <span class="hand second"></span>
                        <span class="pivot"></span>
                    </div>

                    <div class="part knob"></div>
                    <div class="part glass"></div>

                </div>

                <div class="reveal">

                    <svg class="reveal-crown" viewBox="0 0 120 70">
                        <path d="M14 56 L20 18 L40 36 L60 6 L80 36 L100 18 L106 56 Z"></path>
                        <rect x="11" y="56" width="98" height="9"></rect>
                        <circle cx="20" cy="14" r="4"></circle>
                        <circle cx="60" cy="4" r="4.5"></circle>
                        <circle cx="100" cy="14" r="4"></circle>
                    </svg>

                    <span class="reveal-title">UJJAYINI</span>
                    <span class="reveal-tag">THE BEGINNING OF YOUR TIME</span>

                </div>

            </section>

        </div>

    </main>

</template>
