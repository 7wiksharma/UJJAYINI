<template>
    <!-- =========================================================
     UJJAYINI NOTIFICATION
========================================================= -->

<template if:true={showNotification}>

    <div
        class={notificationClass}
        role="status"
        aria-live="polite"
    >

        <div class="notification-symbol">

            <template if:true={notificationType}>
                <span>
                    ✓
                </span>
            </template>

        </div>

        <div class="notification-content">

            <p class="notification-kicker">
                UJJAYINI · THE HOUSE OF TIME
            </p>

            <h3>
                {notificationTitle}
            </h3>

            <p class="notification-message">
                {notificationMessage}
            </p>

        </div>

        <button
            class="notification-close"
            type="button"
            onclick={closeNotification}
            aria-label="Close notification"
        >
            ×
        </button>

    </div>

</template>
    <main class="watches-page">

        <!-- =================================================
             PANTHER VIDEO BACKGROUND
        ================================================== -->
        <div class="video-stage" aria-hidden="true">
            <video
                class={videoClass}
                src={pantherVideoUrl}
                autoplay
                muted
                loop
                playsinline
                preload="auto"
                onloadeddata={handleVideoReady}
            ></video>

            <div class="video-tint"></div>
            <div class="video-vignette"></div>
        </div>


        <!-- =================================================
             HERO
        ================================================== -->
        <section class="catalog-intro">

            <div class="intro-content">

                <p class="eyebrow">
                    THE HOUSE OF UJJAYINI
                </p>

                <h1>
                    Time,
                    <em>in three expressions.</em>
                </h1>

                <div class="intro-rule"></div>

                <p class="intro-copy">
                    Discover the timepieces of UJJAYINI —
                    three distinct expressions of horology,
                    shaped by gold, sapphire and steel.
                </p>

                <button
                    class="intro-cta"
                    type="button"
                    onclick={handleScrollToCatalog}
                >
                    <span>VIEW THE TIMEPIECES</span>
                    <span class="intro-cta-arrow">↓</span>
                </button>

            </div>


            <div class="intro-side">

                <div class="intro-index">

                    <span class="index-roman">
                        III
                    </span>

                    <span class="index-label">
                        THE TIMEPIECES
                    </span>

                </div>


                <template if:true={hasProducts}>

                    <div class="intro-stats">

                        <div class="stat">

                            <strong>
                                {totalCount}
                            </strong>

                            <span>
                                TIMEPIECES
                            </span>

                        </div>

                        <div class="stat">

                            <strong>
                                03
                            </strong>

                            <span>
                                COLLECTIONS
                            </span>

                        </div>

                    </div>

                </template>

            </div>

        </section>



        <!-- =================================================
             CATALOG WORKSPACE
        ================================================== -->
        <section class="catalog-workspace">


            <!-- =================================================
                 LEFT FILTER RAIL
            ================================================== -->
            <aside class="filter-section">

                <div class="filter-header">

                    <div class="filter-brand">

                        <span class="filter-eyebrow">
                            CURATE
                        </span>

                        <span class="filter-eyebrow">
                            YOUR TIME
                        </span>

                    </div>


                    <div class="product-count">

                        {filteredProducts.length}
                        <span>TIMEPIECES</span>

                    </div>


                    <div class="filter-controls">

                        <template
                            for:each={filterOptions}
                            for:item="filter"
                        >

                            <button
                                key={filter.value}
                                class={filter.className}
                                data-filter={filter.value}
                                onclick={handleCollectionFilter}
                            >
                                {filter.label}
                            </button>

                        </template>


                        <select
                            class="sort-select"
                            value={sortBy}
                            onchange={handleSortChange}
                        >

                            <option value="featured">
                                FEATURED
                            </option>

                            <option value="price-low">
                                PRICE · LOW TO HIGH
                            </option>

                            <option value="price-high">
                                PRICE · HIGH TO LOW
                            </option>

                            <option value="name">
                                NAME · A–Z
                            </option>

                        </select>

                    </div>


                    <div class="filter-vertical-line"></div>

                </div>

            </aside>



            <!-- =================================================
                 PRODUCTS AREA
            ================================================== -->
            <div class="catalog-results">


                <!-- =================================================
                     LOADING
                ================================================== -->
                <template if:true={isLoading}>

                    <section class="loading-state">

                        <div class="loader-ring"></div>

                        <p>
                            ENTERING THE HOUSE OF UJJAYINI
                        </p>

                    </section>

                </template>



                <!-- =================================================
                     ERROR
                ================================================== -->
                <template if:true={hasError}>

                    <section class="catalog-state">

                        <p class="state-eyebrow">
                            COLLECTION UNAVAILABLE
                        </p>

                        <h2>
                            The timepieces could not be loaded.
                        </h2>

                        <p>
                            {errorMessage}
                        </p>

                    </section>

                </template>



                <!-- =================================================
                     COLLECTIONS
                ================================================== -->
                <template if:true={hasProducts}>

                    <div class="collections-container">

                        <template
                            for:each={collectionSections}
                            for:item="section"
                        >

                            <section
                                key={section.key}
                                class={section.className}
                            >


                                <!-- COLLECTION HEADER -->
                                <div class="collection-header">

                                    <div class="collection-number">
                                        {section.number}
                                    </div>


                                    <div class="collection-title">

                                        <p class="collection-eyebrow">
                                            {section.eyebrow}
                                        </p>

                                        <h2>
                                            {section.title}
                                        </h2>

                                        <p class="collection-tagline">
                                            {section.tagline}
                                        </p>

                                    </div>


                                    <div class="collection-signature">
                                        {section.signature}
                                    </div>

                                </div>



                                <!-- PRODUCTS -->
                                <div class="product-grid">

                                    <template
                                        for:each={section.products}
                                        for:item="product"
                                    >

                                        <article
                                            key={product.productId}
                                            class="watch-card"
                                            data-product-id={product.productId}
                                            onclick={handleProductClick}
                                        >


                                            <!-- IMAGE -->
                                            <div class="watch-image">

                                                <template
                                                    if:true={product.productImageUrl}
                                                >

                                                    <img
                                                        src={product.productImageUrl}
                                                        alt={product.productName}
                                                        class="watch-image-file"
                                                    />

                                                </template>


                                                <template
                                                    if:false={product.productImageUrl}
                                                >

                                                    <div class="image-placeholder">
                                                        UJJAYINI
                                                    </div>

                                                </template>


                                                <div class="image-shade"></div>


                                                <span class="watch-index">
                                                    {product.displayIndex}
                                                </span>


                                                <button
                                                    class={product.wishlistClass}
                                                    data-product-id={product.productId}
                                                    onclick={handleWishlist}
                                                    disabled={product.isAddingToWishlist}
                                                    title={product.wishlistTitle}
                                                    aria-label={product.wishlistTitle}
                                                >
                                                    {product.wishlistIcon}
                                                </button>

                                            </div>



                                            <!-- DETAILS -->
                                            <div class="watch-details">

                                                <p class="card-collection">
                                                    {product.collectionName}
                                                </p>


                                                <h3>
                                                    {product.productName}
                                                </h3>


                                                <template
                                                    if:true={product.productCode}
                                                >

                                                    <p class="watch-code">
                                                        {product.productCode}
                                                    </p>

                                                </template>


                                                <template
                                                    if:true={product.description}
                                                >

                                                    <p class="watch-description">
                                                        {product.description}
                                                    </p>

                                                </template>


                                                <div class="watch-footer">

                                                    <template
                                                        if:true={product.price}
                                                    >

                                                        <span class="watch-price">
                                                            ₹{product.formattedPrice}
                                                        </span>

                                                    </template>


                                                    <button
                                                        class="explore-button"
                                                        data-product-id={product.productId}
                                                        onclick={handleProductClick}
                                                    >

                                                        <span>
                                                            EXPLORE
                                                        </span>

                                                        <span>
                                                            ↗
                                                        </span>

                                                    </button>

                                                </div>


                                                <button
                                                    class="cart-button"
                                                    data-product-id={product.productId}
                                                    onclick={handleAddToCart}
                                                    disabled={product.isAddingToCart}
                                                >
                                                    {product.cartLabel}
                                                </button>

                                            </div>

                                        </article>

                                    </template>

                                </div>

                            </section>

                        </template>

                    </div>

                </template>



                <!-- =================================================
                     EMPTY
                ================================================== -->
                <template if:true={showEmpty}>

                    <section class="catalog-state">

                        <p class="state-eyebrow">
                            UJJAYINI HOROLOGY
                        </p>

                        <h2>
                            No timepieces found.
                        </h2>

                        <p>
                            Try another collection or reset your filters.
                        </p>

                        <button
                            class="reset-button"
                            onclick={resetFilters}
                        >
                            RESET FILTERS
                        </button>

                    </section>

                </template>


            </div>

        </section>



        <!-- =================================================
             CLOSING
        ================================================== -->
        <section class="catalog-closing">

            <div class="closing-rule"></div>

            <p>
                TIME IS NOT SIMPLY MEASURED.
                <em>IT IS REMEMBERED.</em>
            </p>

        </section>



        <!-- =================================================
             GUEST CART MODAL
        ================================================== -->
        <template if:true={showGuestCartModal}>

            <div
                class="guest-modal-backdrop"
                onclick={closeGuestCartModal}
            >

                <div
                    class="guest-modal"
                    onclick={stopModalPropagation}
                >

                    <button
                        class="guest-modal-close"
                        type="button"
                        onclick={closeGuestCartModal}
                        aria-label="Close"
                    >
                        ×
                    </button>


                    <div class="guest-modal-mark">
                        U
                    </div>


                    <p class="guest-modal-eyebrow">
                        THE HOUSE OF UJJAYINI
                    </p>


                    <h2>
                        Become part of
                        <em>the family.</em>
                    </h2>


                    <div class="guest-modal-rule"></div>


                    <p class="guest-modal-copy">
                        Your collection deserves a place of its own.
                        Sign in or create your UJJAYINI account to
                        add this timepiece to your private collection.
                    </p>


                    <div class="guest-modal-actions">

                        <button
                            class="guest-login-button"
                            type="button"
                            onclick={handleGuestLogin}
                        >
                            SIGN IN
                        </button>


                        <button
                            class="guest-signup-button"
                            type="button"
                            onclick={handleGuestSignup}
                        >
                            BECOME A MEMBER
                        </button>

                    </div>


                    <button
                        class="guest-continue"
                        type="button"
                        onclick={closeGuestCartModal}
                    >
                        CONTINUE EXPLORING
                    </button>

                </div>

            </div>

        </template>

    </main>
</template>
