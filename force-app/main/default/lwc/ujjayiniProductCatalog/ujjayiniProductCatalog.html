<template>
    <lightning-card title="UJJAYINI Collection" icon-name="utility:favorite">

        <div class="catalog-container">

            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="loading-container">
                    <lightning-spinner
                        alternative-text="Loading watches..."
                        size="medium">
                    </lightning-spinner>
                </div>
            </template>


            <!-- Error -->
            <template if:true={hasError}>
                <div class="error-container">
                    <p>
                        Unable to load the watch collection.
                    </p>
                </div>
            </template>


            <!-- Products -->
            <template if:true={hasProducts}>

                <div class="product-grid">

                    <template
                        for:each={products}
                        for:item="product">

                       <div
                          key={product.productId}
                          class="product-card"
                           data-product-id={product.productId}
                            onclick={handleProductClick}>
                            <!-- PRODUCT IMAGE -->
                           <div class="product-image">

    <template if:true={product.productImageUrl}>
        <img
            src={product.productImageUrl}
            alt={product.productName}
            class="product-image-file">
    </template>

    <template if:false={product.productImageUrl}>
        <lightning-icon
            icon-name="utility:clock"
            size="large"
            alternative-text="Watch">
        </lightning-icon>
    </template>
                                <!-- WISHLIST BUTTON -->
                                <button
                                    class="wishlist-button"
                                    data-product-id={product.productId}
                                    onclick={handleWishlist}
                                    disabled={product.isAddingToWishlist}
                                    title="Add to Wishlist">

                                    <template if:true={product.isWishlisted}>
                                        ♥
                                    </template>

                                    <template if:false={product.isWishlisted}>
                                        ♡
                                    </template>

                                </button>

                            </div>


                            <!-- PRODUCT DETAILS -->
                            <div class="product-details">

                                <h2 class="product-name">
                                    {product.productName}
                                </h2>

                                <template if:true={product.collectionName}>
                                    <p class="collection-name">
                                        {product.collectionName}
                                    </p>
                                </template>

                                <template if:true={product.productCode}>
                                    <p class="product-code">
                                        SKU: {product.productCode}
                                    </p>
                                </template>

                                <template if:true={product.description}>
                                    <p class="product-description">
                                        {product.description}
                                    </p>
                                </template>

                                <template if:true={product.price}>
                                    <p class="product-price">
                                        ₹{product.price}
                                    </p>
                                </template>


                                <!-- ADD TO CART -->
                                <button
                                    class="add-to-cart-button"
                                    data-product-id={product.productId}
                                    onclick={handleAddToCart}
                                    disabled={product.isAddingToCart}>

                                    <template if:true={product.isAddingToCart}>
                                        Adding...
                                    </template>

                                    <template if:false={product.isAddingToCart}>
                                        Add to Cart
                                    </template>

                                </button>

                            </div>

                        </div>

                    </template>

                </div>

            </template>


            <!-- No Products -->
            <template if:false={hasProducts}>

                <template if:false={isLoading}>

                    <template if:false={hasError}>

                        <div class="empty-container">

                            <p>
                                No watches are currently available.
                            </p>

                        </div>

                    </template>

                </template>

            </template>

        </div>

    </lightning-card>
</template>
