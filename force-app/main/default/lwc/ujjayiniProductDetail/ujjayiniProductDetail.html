<template>

    <main class={pageClass}>

        <!-- ================= VIDEO BACKGROUND ================= -->
        <div class="backdrop" aria-hidden="true">
            <video
                class="product-video"
                src={videoUrl}
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
            ></video>
            <div class="backdrop-tint"></div>
            <div class="backdrop-glow"></div>
            <div class="backdrop-grain"></div>
        </div>


        <!-- ================= LOADING ================= -->
        <template if:true={isLoading}>
            <section class="state">
                <div class="loader"></div>
                <p class="mono">OPENING THE VAULT</p>
            </section>
        </template>


        <!-- ================= ERROR (never technical) ================= -->
        <template if:true={showError}>
            <section class="state">
                <p class="mono">TIMEPIECE UNAVAILABLE</p>
                <h2>Resting in <em>the vault.</em></h2>
                <p class="state-copy">{errorMessage}</p>
                <button class="btn-line" type="button" onclick={goToWatches}>BACK TO THE COLLECTION</button>
            </section>
        </template>


        <!-- ================= PRODUCT ================= -->
        <template if:true={hasProduct}>

            <!-- Top bar -->
            <header class="topbar">
                <button class="back" type="button" onclick={goToWatches}>
                    <span aria-hidden="true">←</span> THE COLLECTION
                </button>
                <p class="crumbs mono">
                    UJJAYINI <span>/</span> {product.collectionName} <span>/</span> <b>{product.productName}</b>
                </p>
                <span class="mono edition">PRIVATE EDITION</span>
            </header>


            <!-- ============ THE STORY (scroll-driven camera) ============ -->
            <section class="story">

                <div class={stageClass}>

                    <!-- Ambient layers that react to the chapter -->
                    <div class="aperture" aria-hidden="true">
                        <span class="ring r1"></span>
                        <span class="ring r2"></span>
                        <span class="ring r3"></span>
                    </div>

                    <svg class="blueprint" viewBox="0 0 400 400" aria-hidden="true">
                        <circle class="bp-ring" cx="200" cy="200" r="190"></circle>
                        <circle class="bp-ring dashed" cx="200" cy="200" r="160"></circle>
                        <line class="bp-line" x1="10" y1="200" x2="390" y2="200"></line>
                        <line class="bp-line" x1="200" y1="10" x2="200" y2="390"></line>
                        <g class="gear ga">
                            <circle class="teeth" cx="160" cy="180" r="70"></circle>
                            <circle class="hub" cx="160" cy="180" r="52"></circle>
                            <line class="hub" x1="108" y1="180" x2="212" y2="180"></line>
                            <line class="hub" x1="160" y1="128" x2="160" y2="232"></line>
                        </g>
                        <g class="gear gb">
                            <circle class="teeth" cx="268" cy="150" r="42"></circle>
                            <circle class="hub" cx="268" cy="150" r="28"></circle>
                        </g>
                        <g class="gear gc">
                            <circle class="teeth" cx="258" cy="262" r="34"></circle>
                            <circle class="hub" cx="258" cy="262" r="20"></circle>
                        </g>
                        <text class="bp-text" x="20" y="30">CALIBRE · UJ-01</text>
                        <text class="bp-text" x="280" y="388">28,800 VPH</text>
                    </svg>

                    <!-- The camera -->
                    <div class="frame">
                        <div class="frame-clip">
                            <template if:true={hasImage}>
                                <img class="frame-image" src={imageSrc} alt={product.productName} />
                            </template>
                            <template if:false={hasImage}>
                                <span class="frame-fallback">U</span>
                            </template>
                            <span class="sheen" aria-hidden="true"></span>
                            <span class="vignette" aria-hidden="true"></span>
                        </div>
                        <span class="frame-edge" aria-hidden="true"></span>
                    </div>

                    <!-- PROLOGUE -->
                    <div class={prologueClass}>
                        <p class="mono kicker">{product.collectionName} · UJJAYINI</p>
                        <h1 class="name">{product.productName}</h1>
                        <p class="lede">{description}</p>

                        <div class="price-row">
                            <strong class="price">{formattedPrice}</strong>
                            <span class={stockClass}>{stockLabel}</span>
                        </div>

                        <div class="cta-row">
                            <button class="btn-primary" type="button" onclick={handleBuyNow} disabled={disableActions}>
                                <span>{buyNowLabel}</span>
                                <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 12 L12 4 M6 4 H12 V10"></path>
                                </svg>
                            </button>
                            <template if:true={showCartButton}>
                                <button class="btn-line" type="button" onclick={handleAddToCart} disabled={disableActions}>
                                    {cartLabel}
                                </button>
                            </template>
                        </div>

                        <div class="quick-links">
                            <button class="link" type="button" onclick={handlePrivateViewing}>PRIVATE VIEWING</button>
                            <button class="link" type="button" onclick={goToInspect}>MACRO INSPECT</button>
                            <button class="link" type="button" onclick={goToFit}>WRIST FIT</button>
                        </div>

                        <span class="scroll-cue mono" aria-hidden="true">SCROLL TO BEGIN THE STORY <i></i></span>
                    </div>

                    <!-- CHAPTERS -->
                    <template for:each={chapters} for:item="chapter">
                        <article key={chapter.key} class={chapter.className}>
                            <p class="mono kicker"><span class="ch-no">{chapter.number}</span>{chapter.kicker}</p>
                            <h2>{chapter.title} <em>{chapter.accent}</em></h2>
                            <p class="copy">{chapter.copy}</p>
                            <dl class="specs">
                                <template for:each={chapter.specs} for:item="spec">
                                    <div key={spec.key} class="spec">
                                        <dt class="mono">{spec.label}</dt>
                                        <dd>{spec.value}</dd>
                                    </div>
                                </template>
                            </dl>
                        </article>
                    </template>

                    <!-- Rarity counter (chapter 4) -->
                    <div class="rarity" aria-hidden="true">
                        <strong>{rarityNumber}</strong>
                        <span class="mono">{rarityLabel}</span>
                    </div>

                    <!-- Chronograph progress -->
                    <nav class="chrono" aria-label="Chapters">
                        <div class="chrono-dial">
                            <span class="chrono-hand"></span>
                            <span class="chrono-pin"></span>
                        </div>
                        <span class="mono chrono-count">{chapterCounter}</span>
                        <div class="dots">
                            <template for:each={chapterDots} for:item="dot">
                                <button key={dot.key} class={dot.className} type="button" data-index={dot.index} onclick={jumpToChapter} title={dot.name}>
                                    <span class="dot-mark"></span>
                                    <span class="mono dot-name">{dot.number} {dot.name}</span>
                                </button>
                            </template>
                        </div>
                    </nav>

                </div>

            </section>


            <!-- ============ MACRO INSPECT ============ -->
            <section class="inspect section">

                <header class="section-head">
                    <p class="mono kicker">05 · MACRO INSPECT</p>
                    <h2>Bring the <em>loupe closer.</em></h2>
                    <p class="copy">Move across the watch to see it at 2.5×, the way a watchmaker would at the bench. Or let the house guide your eye.</p>
                    <button class="btn-line small" type="button" onclick={toggleTour}>{tourButtonLabel}</button>
                </header>

                <div
                    class={inspectClass}
                    onpointerenter={handleInspectEnter}
                    onpointerleave={handleInspectLeave}
                    onpointermove={handleInspectMove}
                >
                    <template if:true={hasImage}>
                        <img class="inspect-image" src={imageSrc} alt={product.productName} draggable="false" />
                    </template>
                    <span class="corner tl"></span>
                    <span class="corner tr"></span>
                    <span class="corner bl"></span>
                    <span class="corner br"></span>
                    <span class="lens" aria-hidden="true"></span>
                    <template if:true={tourLabel}>
                        <span class="tour-label mono">{tourLabel}</span>
                    </template>
                    <span class="inspect-hint mono">HOVER TO MAGNIFY · 2.5×</span>
                </div>

            </section>


            <!-- ============ WRIST FIT ============ -->
            <section class="fit section">

                <header class="section-head">
                    <p class="mono kicker">06 · ON THE WRIST</p>
                    <h2>See how it <em>sits on you.</em></h2>
                    <p class="copy">Set your wrist size and tone. The watch is drawn to true proportion.</p>
                </header>

                <div class="fit-grid">

                    <div class="fit-canvas">

                        <svg class="arm-svg" viewBox="0 0 900 460" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                            <path class="arm-shadow" d={armPath}></path>
                            <path class="arm-skin" d={armPath} style={armFill}></path>
                            <path class="arm-rim" d={armPath} stroke-width={rimWidth}></path>
                            <path class="arm-light" d={armHighlightPath} stroke-width={highlightWidth}></path>
                            <template for:each={tendons} for:item="tendon">
                                <path key={tendon.key} class="arm-tendon" d={tendon.d}></path>
                            </template>
                            <template for:each={knuckles} for:item="knuckle">
                                <circle key={knuckle.key} class="arm-knuckle" cx={knuckle.cx} cy={knuckle.cy} r={knuckle.r}></circle>
                            </template>
                        </svg>

                        <div class="on-wrist">
                            <span class={strapClass} style={strapStyle}></span>
                            <div class="watch-disc" style={watchOnWristStyle}>
                                <span class="disc-face" style={discFaceStyle}></span>
                                <span class="disc-glass"></span>
                            </div>
                        </div>

                        <span class="ruler mono">{caseLabel} CASE · {wristLabel} WRIST</span>
                    </div>

                    <div class="fit-controls">

                        <div class="control">
                            <p class="mono label">WRIST CIRCUMFERENCE <b>{wristLabel}</b></p>
                            <input class="slider" type="range" min="140" max="200" step="1" value={wristMm} oninput={handleWrist} aria-label="Wrist circumference in millimetres" />
                            <div class="slider-ends mono"><span>140</span><span>200</span></div>
                        </div>

                        <div class="control">
                            <p class="mono label">CASE SIZE PREVIEW <b>{caseLabel}</b></p>
                            <div class="sizes">
                                <template for:each={caseOptions} for:item="size">
                                    <button key={size.key} class={size.className} type="button" data-value={size.value} aria-pressed={size.pressed} onclick={handleCaseSize}>{size.label}</button>
                                </template>
                            </div>
                        </div>

                        <div class="control">
                            <p class="mono label">SKIN TONE</p>
                            <div class="swatches">
                                <template for:each={skinOptions} for:item="tone">
                                    <button key={tone.key} class={tone.className} style={tone.style} type="button" data-key={tone.key} aria-pressed={tone.pressed} aria-label={tone.label} title={tone.label} onclick={handleSkin}></button>
                                </template>
                            </div>
                        </div>

                        <div class="verdict">
                            <div class="meter"><span class="meter-dot" style={fitMeterStyle}></span></div>
                            <div class="meter-labels mono"><span>DISCREET</span><span>BALANCED</span><span>BOLD</span></div>
                            <p class="verdict-title">{fitVerdict}</p>
                            <p class="copy">{fitCopy}</p>
                        </div>

                    </div>

                </div>

            </section>


            <!-- ============ PRIVATE VIEWING ============ -->
            <section class="request-anchor section">
                <header class="section-head center">
                    <p class="mono kicker">07 · PRIVATE ACQUISITION</p>
                    <h2>Make this timepiece <em>yours.</em></h2>
                    <p class="copy">Speak with the UJJAYINI house about availability, details and your private acquisition.</p>
                </header>
                <div class="request-shell">
                    <c-ujjayini-watch-request watch-id={product.productId}></c-ujjayini-watch-request>
                </div>
            </section>


            <!-- ============ SIMILAR ============ -->
            <template if:true={hasSimilar}>
                <section class="similar section">
                    <header class="section-head">
                        <p class="mono kicker">08 · KINDRED TIMEPIECES</p>
                        <h2>You may also <em>remember.</em></h2>
                    </header>
                    <div class="similar-grid">
                        <template for:each={similar} for:item="item">
                            <button key={item.productId} class={item.className} type="button" data-id={item.productId} onclick={openSimilar}>
                                <span class="similar-visual">
                                    <template if:true={item.hasImage}>
                                        <img src={item.image} alt={item.productName} loading="lazy" />
                                    </template>
                                    <span class="similar-index mono">{item.index}</span>
                                    <template if:true={item.isArchive}>
                                        <span class="similar-badge mono">ARCHIVE PIECE</span>
                                    </template>
                                </span>
                                <span class="similar-body">
                                    <span class="mono similar-collection">{item.collectionName}</span>
                                    <span class="similar-name">{item.productName}</span>
                                    <span class="similar-foot">
                                        <span class="similar-price">{item.price}</span>
                                        <span class="similar-go mono">DISCOVER →</span>
                                    </span>
                                </span>
                            </button>
                        </template>
                    </div>
                </section>
            </template>


            <!-- ============ STICKY BUY BAR ============ -->
            <div class={buyBarClass}>
                <span class="bar-name">{product.productName}</span>
                <span class="bar-price">{formattedPrice}</span>
                <button class="btn-primary small" type="button" onclick={handleBuyNow} disabled={disableActions}>
                    <span>{buyNowLabel}</span>
                    <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M4 12 L12 4 M6 4 H12 V10"></path>
                    </svg>
                </button>
                <template if:true={showCartButton}>
                    <button class="btn-line small" type="button" onclick={handleAddToCart} disabled={disableActions}>{cartLabel}</button>
                </template>
            </div>

        </template>


        <!-- ================= NOTIFICATION ================= -->
        <template if:true={showNotification}>
            <div class={notificationClass} role="status" aria-live="polite">
                <div>
                    <span class="mono">UJJAYINI · THE HOUSE OF TIME</span>
                    <h3>{notificationTitle}</h3>
                    <p>{notificationMessage}</p>
                </div>
                <button type="button" onclick={closeNotification} aria-label="Close">✕</button>
            </div>
        </template>


        <!-- ================= GUEST MODAL ================= -->
        <template if:true={showGuestCartModal}>
            <div class="guest-backdrop" onclick={closeGuestCartModal}>
                <div class="guest-modal" onclick={stopModalPropagation}>
                    <button class="modal-close" type="button" onclick={closeGuestCartModal} aria-label="Close">✕</button>
                    <div class="modal-symbol">U</div>
                    <p class="mono">THE HOUSE OF UJJAYINI</p>
                    <h2>Become part of <em>the family.</em></h2>
                    <p class="copy">Sign in or create your UJJAYINI account to make this timepiece part of your collection.</p>
                    <div class="modal-actions">
                        <button class="btn-primary" type="button" onclick={handleGuestLogin}><span>SIGN IN</span></button>
                        <button class="btn-line" type="button" onclick={handleGuestSignup}>BECOME A MEMBER</button>
                    </div>
                    <button class="link" type="button" onclick={closeGuestCartModal}>CONTINUE EXPLORING</button>
                </div>
            </div>
        </template>

    </main>

</template>
