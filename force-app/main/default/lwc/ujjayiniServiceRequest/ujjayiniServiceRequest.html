<template>

    <section class="service-shell">

        <div class="service-light" aria-hidden="true"></div>

        <div class="service-inner">

            <header class="service-header">

                <p class="eyebrow">
                    UJJAYINI · SERVICE
                </p>

                <h2>
                    Care for your <em>time.</em>
                </h2>

                <div class="gold-rule"></div>

                <p class="description">
                    Request repair, maintenance, inspection,
                    or other assistance for your timepiece.
                </p>

            </header>


            <div class="service-form">

                <template if:true={showAssetSelector}>

                    <label class="field">

                        <span class="field-label">
                            TIMEPIECE
                        </span>

                        <span class="select-wrap">

                            <select
                                class="field-control"
                                onchange={handleAssetChange}
                            >
                                <template
                                    for:each={assetOptions}
                                    for:item="option"
                                >
                                    <option
                                        key={option.key}
                                        value={option.value}
                                        selected={option.selected}
                                    >
                                        {option.label}
                                    </option>
                                </template>
                            </select>

                        </span>

                    </label>

                </template>


                <div class="field-row">

                    <label class="field">

                        <span class="field-label">
                            SERVICE TYPE
                        </span>

                        <span class="select-wrap">

                            <select
                                class="field-control"
                                onchange={handleServiceTypeChange}
                            >
                                <template
                                    for:each={serviceTypeOptions}
                                    for:item="option"
                                >
                                    <option
                                        key={option.key}
                                        value={option.value}
                                        selected={option.selected}
                                    >
                                        {option.label}
                                    </option>
                                </template>
                            </select>

                        </span>

                    </label>


                    <label class="field">

                        <span class="field-label">
                            PRIORITY
                        </span>

                        <span class="select-wrap">

                            <select
                                class="field-control"
                                onchange={handlePriorityChange}
                            >
                                <template
                                    for:each={priorityOptions}
                                    for:item="option"
                                >
                                    <option
                                        key={option.key}
                                        value={option.value}
                                        selected={option.selected}
                                    >
                                        {option.label}
                                    </option>
                                </template>
                            </select>

                        </span>

                    </label>

                </div>


                <label class="field">

                    <span class="field-label">
                        SERVICE DESCRIPTION
                    </span>

                    <textarea
                        class="field-control field-textarea"
                        rows="5"
                        value={description}
                        oninput={handleDescriptionChange}
                        placeholder="Describe the service you need..."
                    ></textarea>

                </label>


                <template if:true={successMessage}>

                    <div class="message success-message" role="status">
                        {successMessage}
                    </div>

                </template>

                <template if:true={errorMessage}>

                    <div class="message error-message" role="alert">
                        {errorMessage}
                    </div>

                </template>


                <div class="actions">

                    <button
                        class="submit-button"
                        type="button"
                        onclick={handleSubmit}
                        disabled={isSubmitting}
                    >

                        <span class="submit-inner">

                            <template if:true={isSubmitting}>
                                SUBMITTING
                            </template>

                            <template if:false={isSubmitting}>
                                SUBMIT SERVICE REQUEST
                            </template>

                        </span>

                    </button>

                </div>

            </div>

        </div>

    </section>

</template>
