<template>

    <section class="history-section">

        <div class="history-header">

            <div>

                <p class="eyebrow">
                    YOUR SERVICE
                </p>

                <h2>
                    Service history.
                </h2>

            </div>

            <p class="history-intro">
                A record of your requests and
                their latest resolution.
            </p>

        </div>


        <!-- GUEST -->
        <template if:true={showGuestState}>

            <div class="guest-state">

                <div class="state-symbol">
                    U
                </div>

                <div class="state-content">

                    <p class="state-kicker">
                        COLLECTOR ACCESS
                    </p>

                    <h3>
                        Sign in to view your service history.
                    </h3>

                    <p>
                        Your service requests are available
                        to registered UJJAYINI collectors.
                    </p>

                </div>

            </div>

        </template>


        <!-- LOADING -->
        <template if:true={isLoading}>

            <div class="loading-state">

                <span class="loader"></span>

                <p>
                    Loading your service history...
                </p>

            </div>

        </template>


        <!-- ERROR -->
        <template if:true={errorMessage}>

            <div class="error-state">

                <div class="error-symbol">
                    !
                </div>

                <div>

                    <strong>
                        Unable to load history.
                    </strong>

                    <p>
                        {errorMessage}
                    </p>

                </div>

            </div>

        </template>


        <!-- REQUESTS -->
        <template if:true={hasRequests}>

            <div class="requests-list">

                <template
                    for:each={requests}
                    for:item="request">

                    <article
                        key={request.serviceRequestId}
                        class="request-row">


                        <!-- LEFT -->
                        <div class="request-main">

                            <div class="request-heading">

                                <span class="request-index">
                                    SR
                                </span>

                                <div>

                                    <p class="request-type">
                                        {request.serviceType}
                                    </p>

                                    <p class="request-date">
                                        {request.formattedDate}
                                    </p>

                                </div>

                            </div>


                            <p class="request-description">
                                {request.description}
                            </p>

                        </div>


                        <!-- MIDDLE -->
                        <div class="request-meta">

                            <div class="meta-item">

                                <span>
                                    CASE
                                </span>

                                <strong>
                                    <template if:true={request.caseNumber}>
                                        {request.caseNumber}
                                    </template>

                                    <template if:false={request.caseNumber}>
                                        —
                                    </template>
                                </strong>

                            </div>


                            <div class="meta-item">

                                <span>
                                    PRIORITY
                                </span>

                                <strong>
                                    {request.priority}
                                </strong>

                            </div>

                        </div>


                        <!-- RIGHT -->
                        <div class="request-status">

                            <template if:true={request.resolution}>

                                <span class="status resolved">
                                    RESOLVED
                                </span>

                                <p class="resolution-preview">
                                    {request.resolution}
                                </p>

                            </template>


                            <template if:false={request.resolution}>

                                <span class="status pending">
                                    IN REVIEW
                                </span>

                                <p class="resolution-preview">
                                    Our service team is reviewing
                                    your request.
                                </p>

                            </template>

                        </div>

                    </article>

                </template>

            </div>

        </template>


        <!-- EMPTY -->
        <template if:true={isEmpty}>

            <div class="empty-state">

                <div class="empty-symbol">
                    ∅
                </div>

                <div>

                    <p class="empty-kicker">
                        NO SERVICE RECORDS
                    </p>

                    <h3>
                        Nothing here yet.
                    </h3>

                    <p>
                        Your submitted service requests
                        will appear here once created.
                    </p>

                </div>

            </div>

        </template>

    </section>

</template>
