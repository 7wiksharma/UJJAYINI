<template>
    <header class={headerClass}>

        <div class="header-inner">

            <!-- BRAND -->
            <a href="/ujjayini/" class="brand" aria-label="UJJAYINI Home">
                <span class="brand-name">UJJAYINI</span>
                <span class="brand-tagline">THE BEGINNING OF YOUR TIME</span>
            </a>

            <!-- DESKTOP NAVIGATION -->
            <nav class="main-nav" aria-label="Primary navigation">
                <a href="/ujjayini/" class={homeNavClass}>HOME</a>
                <a href="/ujjayini/collections" class={collectionsNavClass}>COLLECTIONS</a>
                <a href="/ujjayini/watches" class={watchesNavClass}>WATCHES</a>
                <a href="/ujjayini/about-us" class={aboutNavClass}>ABOUT US</a>
                <a href="/ujjayini/service" class={serviceNavClass}>SERVICE</a>
            </nav>

            <!-- RIGHT ACTIONS -->
            <div class="utility-nav">

                <a href="/ujjayini/wishlist" class={wishlistIconClass} aria-label="Wishlist" title="Wishlist">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20s-7-4.4-7-10.1A4 4 0 0 1 12 7.3a4 4 0 0 1 7 2.6C19 15.6 12 20 12 20z"></path>
                    </svg>
                </a>

                <a href="/ujjayini/cart" class={cartIconClass} aria-label={cartLabel} title="Cart">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5.5 8.5h13l-1.1 11.5H6.6L5.5 8.5z"></path>
                        <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"></path>
                    </svg>
                    <template if:true={hasCartItems}>
                        <span class="badge">{cartBadge}</span>
                    </template>
                </a>

                <!-- GUEST -->
                <template if:false={isLoggedIn}>
                    <a href="/ujjayini/login" class="utility-link">LOGIN</a>
                    <a href="/ujjayini/SelfRegister" class="utility-link signup-link">SIGN UP</a>
                </template>

                <!-- SIGNED IN -->
                <template if:true={isLoggedIn}>

                    <div class="account-wrap">

                        <button
                            class={accountButtonClass}
                            type="button"
                            onclick={toggleAccountMenu}
                            aria-haspopup="true"
                            aria-expanded={accountExpanded}
                            aria-label="Your account"
                        >
                            <span class="avatar">{initials}</span>
                        </button>

                        <template if:true={accountMenuOpen}>

                            <div class="account-menu" role="menu">

                                <div class="account-head">
                                    <span class="account-kicker">SIGNED IN AS</span>
                                    <span class="account-name">{displayName}</span>
                                </div>

                                <a href="/ujjayini/my-account" class="account-item" role="menuitem" onclick={closeMenu}>
                                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <circle cx="12" cy="8" r="3.5"></circle>
                                        <path d="M5 20c1.4-3.4 4-5 7-5s5.6 1.6 7 5"></path>
                                    </svg>
                                    <span>MY ACCOUNT</span>
                                </a>

                                <a href="/ujjayini/order-history" class="account-item" role="menuitem" onclick={closeMenu}>
                                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M7 3.5h7.5l3.5 3.5v13.5H7z"></path>
                                        <path d="M14.5 3.5V7H18"></path>
                                        <path d="M9.5 12h6M9.5 15.5h6"></path>
                                    </svg>
                                    <span>ORDERS</span>
                                </a>

                                <a href="/ujjayini/collector-vault" class="account-item" role="menuitem" onclick={closeMenu}>
                                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <rect x="5" y="10.5" width="14" height="10" rx="1"></rect>
                                        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path>
                                    </svg>
                                    <span>COLLECTOR'S VAULT</span>
                                </a>

                                <div class="account-divider"></div>

                                <button type="button" class="account-item sign-out" role="menuitem" onclick={handleSignOut}>
                                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M14 4h5v16h-5"></path>
                                        <path d="M10 8l-4 4 4 4"></path>
                                        <path d="M6 12h10"></path>
                                    </svg>
                                    <span>SIGN OUT</span>
                                </button>

                            </div>

                        </template>

                    </div>

                </template>

                <span class="utility-divider"></span>

                <a href="/ujjayini/collector-vault" class="vault-button">
                    <span>ENTER VAULT</span>
                    <span class="vault-arrow">↗</span>
                </a>

            </div>

            <!-- MOBILE MENU BUTTON -->
            <button
                class={menuButtonClass}
                type="button"
                onclick={toggleMenu}
                aria-label="Toggle navigation menu"
                aria-expanded={menuExpanded}
            >
                <span class="bar bar-top"></span>
                <span class="bar bar-bottom"></span>
            </button>

        </div>

        <!-- MOBILE NAVIGATION -->
        <template if:true={menuOpen}>

            <nav class="mobile-menu" aria-label="Mobile navigation">

                <template if:true={isLoggedIn}>
                    <div class="mobile-account">
                        <span class="avatar">{initials}</span>
                        <div>
                            <span class="account-kicker">SIGNED IN AS</span>
                            <span class="account-name">{displayName}</span>
                        </div>
                    </div>
                </template>

                <a href="/ujjayini/" onclick={closeMenu} class={homeMobileClass}>
                    <span class="mobile-index">01</span>HOME
                </a>
                <a href="/ujjayini/collections" onclick={closeMenu} class={collectionsMobileClass}>
                    <span class="mobile-index">02</span>COLLECTIONS
                </a>
                <a href="/ujjayini/watches" onclick={closeMenu} class={watchesMobileClass}>
                    <span class="mobile-index">03</span>WATCHES
                </a>
                <a href="/ujjayini/about-us" onclick={closeMenu} class={aboutMobileClass}>
                    <span class="mobile-index">04</span>ABOUT US
                </a>
                <a href="/ujjayini/service" onclick={closeMenu} class={serviceMobileClass}>
                    <span class="mobile-index">05</span>SERVICE
                </a>
                <a href="/ujjayini/wishlist" onclick={closeMenu} class={wishlistMobileClass}>
                    <span class="mobile-index">06</span>WISHLIST
                </a>
                <a href="/ujjayini/cart" onclick={closeMenu} class={cartMobileClass}>
                    <span class="mobile-index">07</span>CART
                    <template if:true={hasCartItems}>
                        <span class="mobile-badge">{cartBadge}</span>
                    </template>
                </a>

                <template if:false={isLoggedIn}>
                    <a href="/ujjayini/login" onclick={closeMenu} class="mobile-link">
                        <span class="mobile-index">08</span>LOGIN
                    </a>
                    <a href="/ujjayini/SelfRegister" onclick={closeMenu} class="mobile-link">
                        <span class="mobile-index">09</span>SIGN UP
                    </a>
                </template>

                <template if:true={isLoggedIn}>
                    <a href="/ujjayini/my-account" onclick={closeMenu} class={accountMobileClass}>
                        <span class="mobile-index">08</span>MY ACCOUNT
                    </a>
                    <a href="/ujjayini/order-history" onclick={closeMenu} class={ordersMobileClass}>
                        <span class="mobile-index">09</span>ORDERS
                    </a>
                    <button type="button" onclick={handleSignOut} class="mobile-link mobile-signout">
                        <span class="mobile-index">10</span>SIGN OUT
                    </button>
                </template>

                <a href="/ujjayini/collector-vault" onclick={closeMenu} class="mobile-vault">
                    <span>ENTER COLLECTOR'S VAULT</span>
                    <span class="vault-arrow">↗</span>
                </a>

            </nav>

        </template>

    </header>
</template>
