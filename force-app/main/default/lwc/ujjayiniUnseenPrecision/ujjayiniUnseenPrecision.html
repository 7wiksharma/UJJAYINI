        ====================================================== -->

        <div class="precision-container">

                 INTRO
            ================================================== -->

            <header class="precision-intro">

                <div class="eyebrow">
                    UNSEEN PRECISION
                </div>

                <h2>
                    Every second,<br />
                    <em>measured by the sky.</em>
                </h2>

                <div class="intro-rule"></div>

                <p class="intro-copy">
                    Beneath every measured hour lies a quieter
                    system — cycles of stars, divisions of the day,
                    and the geometry of the heavens.
                </p>

            ================================================== -->

            <div class="movement-wrapper">

                <div class="movement">

                    ================================================== -->

                    <div class="movement-ring ring-outer">

                        <template
                            for:each={nakshatraDots}
                            for:item="dot"
                        >

                            <span
                                key={dot.id}
                                class="nakshatra-dot"
                                style={dot.style}
                            ></span>

                        </template>

                    </div>


                    <!-- =================================================
                         27 NAKSHATRA MARKS
                    ================================================== -->

                    <div class="nakshatra-ring">

                        <template
                            for:each={nakshatraTicks}
                            for:item="tick"
                        >

                            <span
                                key={tick.id}
                                class="nakshatra-tick"
                                style={tick.style}
                            ></span>

                        </template>

                    </div>


                    <!-- =================================================
                         12 RASHI TICKS
                    ================================================== -->

                    <div class="rashi-ring">

                        <template
                            for:each={rashiTicks}
                            for:item="tick"
                        >

                            <span

                                class="rashi-tick"
                                style={tick.style}

                    ================================================== -->

                    <div class="guilloche">

                        <div class="guilloche-line line-01"></div>
                        <div class="guilloche-line line-02"></div>
                        <div class="guilloche-line line-03"></div>
                        <div class="guilloche-line line-04"></div>
                        <div class="guilloche-line line-05"></div>
                        <div class="guilloche-line line-06"></div>

                    ================================================== -->

                    <div class="inner-ring inner-ring-one"></div>
                    <div class="inner-ring inner-ring-two"></div>
                    <div class="inner-ring inner-ring-three"></div>


                    <!-- =================================================
                         CENTRAL SUNBURST
                    ================================================== -->

                    <div class="sunburst">

                        <span class="sunburst-core"></span>

                        <span class="ray ray-01"></span>
                        <span class="ray ray-02"></span>
                        <span class="ray ray-03"></span>
                        <span class="ray ray-04"></span>
                        <span class="ray ray-05"></span>
                        <span class="ray ray-06"></span>
                        <span class="ray ray-07"></span>
                        <span class="ray ray-08"></span>

                    </div>

                         MERIDIAN
                    ================================================== -->

                    <div class="meridian"></div>

                    <div class="meridian-label">
                        UJJAIN

                         CENTRAL POINT
                    ================================================== -->

                    <div class="center-point">

                        <div class="center-inner"></div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 MEASUREMENT LINE
            ================================================== -->

            <div class="measurement-line">

                <span></span>

                <p>
                    TIME · OBSERVED · DIVIDED · MEASURED
                </p>

                <span></span>

            </div>

                 STATISTICS
            ================================================== -->

            <section
                class="precision-stats"
                aria-label="Time measurements"
            >

                <article class="stat">

                    <div class="stat-number">

                        <span
                            class="counter"
                            data-target="27"
                        >
                            {nakshatraCount}
                        </span>

                    </div>

                    <div class="stat-rule"></div>

                    <div class="stat-label">
                        NAKṢATRAS
                    </div>

                    <p>
                        The twenty-seven stellar divisions
                        used to mark celestial passage.
                    </p>

                </article>


                <article class="stat">

                    <div class="stat-number">

                        <span
                            class="counter"
                            data-target="12"
                        >
                            {rashiCount}
                        </span>

                    </div>

                    <div class="stat-rule"></div>

                    <div class="stat-label">
                        RĀŚIS
                    </div>

                    <p>
                        Twelve divisions tracing the
                        zodiacal path across the sky.
                    </p>

                </article>


                <article class="stat">

                    <div class="stat-number">

                        <span
                            class="counter"
                            data-target="60"
                        >
                            {ghatikaCount}
                        </span>

                    </div>

                    <div class="stat-rule"></div>

                    <div class="stat-label">
                        GHAṬIKĀS A DAY
                    </div>

                    <p>
                        A traditional division of the
                        day into sixty ghaṭikās.
                    </p>

                </article>

            </section>

                 CRAFT NOTES
            ================================================== -->

            <section class="craft-notes">

                <div class="craft-intro">

                    <span>

                        <h3>

                        <p>
                            Components arranged as a precise

                            interaction has a purpose.
                        </p>

                </article>


                <article class="craft-note">

                    <div class="craft-number">
                        02
                    </div>

                    <div class="craft-content">

                        <h3>
                            Finishing
                        </h3>

                            part of the visual language of time.
                        </p>

                    </div>

                </article>


                <article class="craft-note">

                    <div class="craft-number">
                        03
                    </div>

                    <div class="craft-content">

                        <h3>
                            Testing
                        </h3>

                            Precision and function are verified
                            through controlled checks.
                        </p>

                    </div>

            </section>

                 CLOSING STATEMENT
            ================================================== -->

            <div class="precision-closing">

                <div class="closing-line"></div>

                    <em>WHAT WE MEASURE IS TIME.</em>
                </p>
