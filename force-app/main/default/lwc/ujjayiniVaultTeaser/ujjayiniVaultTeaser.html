<template>

    <section class="vault-section">

        <!-- CINEMATIC WATCH VISUAL -->
        <div
            class="vault-visual"
            style={vaultVisualStyle}>
        </div>

        <!-- CINEMATIC OVERLAY -->
        <div class="visual-overlay"></div>

        <!-- GOLD ATMOSPHERE -->
        <div class="gold-atmosphere"></div>


        <!-- TOP METADATA -->

        <div class="vault-meta meta-left">
            UJJAYINI · PRIVATE HOROLOGY
        </div>

        <div class="vault-meta meta-right">
            PRIVATE<br />
            COLLECTION
        </div>


        <!-- MAIN CONTENT -->

        <div class="vault-content">

            <div class="vault-copy">

                <p class="eyebrow">
                    THE COLLECTOR'S VAULT
                </p>


                <h2>
                    Time<br />
                    becomes<br />
                    <em>yours.</em>
                </h2>


                <div class="gold-rule"></div>


                <p class="lead">
                    A private space created for those who
                    choose to own a piece of UJJAYINI.
                </p>


                <p class="description">
                    Discover your timepieces, ownership records,
                    warranties and the story behind every watch
                    that becomes part of your collection.
                </p>


                <button
                    class="vault-button"
                    onclick={handleEnterVault}>

                    <span>
                        ENTER THE VAULT
                    </span>

                    <span class="arrow">
                        ↗
                    </span>

                </button>

            </div>

        </div>


        <!-- SIDE LABEL -->

        <div class="side-label ownership">

            <span></span>

            OWNERSHIP

            <small>
                ARCHIVE
            </small>

        </div>


        <!-- CLOSING STATEMENT -->

        <div class="vault-closing">

            <div class="closing-line"></div>

            <p>
                YOUR TIMEPIECE.
                <em>YOUR STORY.</em>
            </p>

            <div class="closing-line"></div>

        </div>


        <!-- SECTION MARKER -->

        <div class="section-marker">

            <span>
                VI
            </span>

            <span class="marker-line"></span>

            <span>
                THE COLLECTOR'S VAULT
            </span>

        </div>

    </section>

</template>
