<template>

    <section
        class="wishlist-page"
        style={backgroundStyle}
    >

        <!-- ============================================= -->
        <!-- ATMOSPHERE -->
        <!-- ============================================= -->

        <div class="atmosphere"></div>

        <div class="gold-orbit orbit-one"></div>
        <div class="gold-orbit orbit-two"></div>


        <!-- ============================================= -->
        <!-- MAIN CONTENT -->
        <!-- ============================================= -->

        <div class="wishlist-shell">


            <!-- ========================================= -->
            <!-- HEADER -->
            <!-- ========================================= -->

            <header class="wishlist-header">

                <div class="header-left">

                    <p class="eyebrow">
                        UJJAYINI · THE PRIVATE COLLECTION
                    </p>

                    <h1>
                        My Wishlist
                    </h1>

                    <p class="subtitle">
                        Timepieces worth remembering.
                    </p>

                </div>


                <div class="header-right">

                    <span class="item-count">
                        {itemCountLabel}
                    </span>

                </div>

            </header>


            <!-- ========================================= -->
            <!-- GOLD DIVIDER -->
            <!-- ========================================= -->

            <div class="gold-divider">
                <span></span>
            </div>


            <!-- ========================================= -->
            <!-- LOADING -->
            <!-- ========================================= -->

            <template if:true={isLoading}>

                <div class="state loading-state">

                    <div class="loader-ring"></div>

                    <p>
                        CURATING YOUR SAVED TIMEPIECES
                    </p>

                </div>

            </template>


            <!-- ========================================= -->
            <!-- ERROR -->
            <!-- ========================================= -->

            <template if:true={errorMessage}>

                <div class="state error-state">

                    <p class="state-code">
                        UJJAYINI · 04
                    </p>

                    <h2>
                        Unable to access your collection.
                    </h2>

                    <p>
                        {errorMessage}
                    </p>

                    <button
                        class="secondary-button"
                        onclick={handleBrowseCollection}
                    >
                        RETURN TO COLLECTION
                    </button>

                </div>

            </template>


            <!-- ========================================= -->
            <!-- WISHLIST ITEMS -->
            <!-- ========================================= -->

            <template if:true={hasItems}>

                <div class="wishlist-grid">

                    <template
                        for:each={wishlistItems}
                        for:item="item"
                    >

                        <article
                            key={item.wishlistItemId}
                            class="wishlist-card"
                        >


                            <!-- ================================= -->
                            <!-- IMAGE -->
                            <!-- ================================= -->

                            <div
                                class="watch-visual"
                                data-product-id={item.productId}
                                onclick={handleViewProduct}
                            >

                                <template if:true={item.hasImage}>

                                    <img
                                        src={item.productImageUrl}
                                        alt={item.productName}
                                        class="watch-image"
                                    />

                                </template>

                                <template if:false={item.hasImage}>

                                    <div class="image-fallback">
                                        UJJAYINI
                                    </div>

                                </template>


                                <div class="image-overlay"></div>


                                <span class="view-label">
                                    VIEW TIMEPIECE
                                </span>

                            </div>


                            <!-- ================================= -->
                            <!-- CONTENT -->
                            <!-- ================================= -->

                            <div class="watch-content">


                                <div class="watch-meta">

                                    <template
                                        if:true={item.hasCollection}
                                    >

                                        <span>
                                            {item.collectionName}
                                        </span>

                                    </template>

                                    <span>
                                        SAVED
                                    </span>

                                </div>


                                <h2>
                                    {item.productName}
                                </h2>


                                <div class="watch-footer">


                                    <template
                                        if:true={item.hasPrice}
                                    >

                                        <span class="price">
                                            {item.formattedPrice}
                                        </span>

                                    </template>


                                    <template
                                        if:false={item.hasPrice}
                                    >

                                        <span class="price unavailable">
                                            PRICE UNAVAILABLE
                                        </span>

                                    </template>


                                    <span class="saved-mark">
                                        ✦
                                    </span>

                                </div>


                                <!-- ================================= -->
                                <!-- ACTIONS -->
                                <!-- ================================= -->

                                <div class="actions">


                                    <button
                                        class="cart-button"
                                        data-product-id={item.productId}
                                        onclick={handleAddToCart}
                                        disabled={processingProductId}
                                    >
                                        ADD TO CART
                                    </button>


                                    <button
                                        class="remove-button"
                                        data-product-id={item.productId}
                                        onclick={handleRemove}
                                        disabled={processingProductId}
                                    >
                                        REMOVE
                                    </button>


                                </div>

                            </div>

                        </article>

                    </template>

                </div>

            </template>


            <!-- ========================================= -->
            <!-- EMPTY WISHLIST -->
            <!-- ========================================= -->

            <template if:true={isEmpty}>

                <div class="empty-state">


                    <div class="empty-symbol">
                        ♡
                    </div>


                    <p class="empty-eyebrow">
                        YOUR PRIVATE COLLECTION
                    </p>


                    <h2>
                        Nothing saved yet.
                    </h2>


                    <p class="empty-copy">
                        The watches you choose to remember
                        will appear here.
                    </p>


                    <button
                        class="primary-button"
                        onclick={handleBrowseCollection}
                    >
                        EXPLORE THE COLLECTION
                    </button>

                </div>

            </template>


            <!-- ========================================= -->
            <!-- FOOT NOTE -->
            <!-- ========================================= -->

            <template if:true={hasItems}>

                <div class="wishlist-note">

                    <span class="note-line"></span>

                    <p>
                        UJJAYINI · THE BEGINNING OF YOUR TIME
                    </p>

                    <span class="note-line"></span>

                </div>

            </template>


        </div>

    </section>

</template>
